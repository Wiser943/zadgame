<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8f1017">
  <title>GameHub</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #8f1017;
      --red2: #b3141c;
      --gold: #f7c52b;
      --bg: #f3f3f3;
      --ink: #1b1b1f;
      --mute: #6b6b76;
      --card: #fff;
      --line: #e6e6e6;
      --input-bg: #fff
    }
    
    html[data-theme="dark"] {
      --bg: #101014;
      --ink: #f1f1f4;
      --mute: #9a9aa4;
      --card: #1b1b22;
      --line: #2c2c35;
      --input-bg: #23232c
    }
    
    html[data-theme="dark"] .top,
    html[data-theme="dark"] .pcover {
      background: linear-gradient(160deg, #4a070c, #7a0f16)
    }
    
    html[data-theme="dark"] input {
      background: var(--input-bg);
      color: var(--ink);
      border-color: #3a3a45
    }
    
    html[data-theme="dark"] .cell {
      background: #23232c
    }
    
    html[data-theme="dark"] .lrow {
      background: #1b1b22
    }
    
    html[data-theme="dark"] .sheet,
    html[data-theme="dark"] .over,
    html[data-theme="dark"] .game,
    html[data-theme="dark"] .room,
    html[data-theme="dark"] .pstat {
      background: var(--card);
      color: var(--ink);
      border-color: var(--line)
    }
    
    html[data-theme="dark"] .btn.ghost {
      background: var(--card);
      color: var(--ink);
      box-shadow: inset 0 0 0 2px var(--line)
    }
    
    html[data-theme="dark"] .room {
      background: #23232c
    }
    
    html[data-theme="dark"] .tag {
      background: #2c2c35;
      color: var(--mute)
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }
    
    html,
    body {
      margin: 0;
      height: 100%;
      font-family: Poppins, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      transition: background .2s ease, color .2s ease
    }
    
    button {
      font: inherit;
      cursor: pointer;
      border: 0
    }
    
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }
    
    #app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100%;
      position: relative
    }
    
    .btn {
      background: var(--red2);
      color: #fff;
      font-weight: 600;
      padding: 14px 22px;
      border-radius: 999px;
      box-shadow: inset 0 0 0 2px #d4444b
    }
    
    .btn.ghost {
      background: #fff;
      color: var(--red);
      box-shadow: inset 0 0 0 2px #e9c4c6
    }
    
    .btn:disabled {
      opacity: .5
    }
    
    /* login */
    .login {
      min-height: 100vh;
      background: var(--red);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      text-align: center
    }
    
    .login h1 {
      font-size: 44px;
      font-weight: 800;
      margin: 0;
      color: var(--gold);
      letter-spacing: -1px;
      text-shadow: 0 4px 0 #6d0a10
    }
    
    .login p {
      margin: 0;
      opacity: .85
    }
    
    .login .btn {
      background: #fff;
      color: var(--ink);
      box-shadow: none;
      padding: 14px 26px
    }
    
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      color: rgba(255, 255, 255, .65);
      font-size: 13px
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, .25)
    }
    
    .login form {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }
    
    .login input.plain {
      text-transform: none;
      letter-spacing: normal;
      border: 0
    }
    
    .err {
      color: #ffe3e3;
      background: rgba(0, 0, 0, .28);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 13px;
      width: 100%;
      max-width: 320px
    }
    
    .switch {
      font-size: 14px;
      opacity: .9
    }
    
    .switch button {
      background: none;
      color: var(--gold);
      text-decoration: underline;
      padding: 0;
      font-weight: 600
    }
    
    /* lobby */
    .top {
      background: linear-gradient(160deg, #6d0a10, #b3141c);
      color: #fff;
      padding: calc(env(safe-area-inset-top, 0px) + 22px) 22px 26px;
      border-radius: 0 0 28px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }
    
    .top small {
      opacity: .8;
      font-size: 13px
    }
    
    .top b {
      display: block;
      font-size: 34px;
      font-weight: 700
    }
    
    .me {
      display: flex;
      align-items: center;
      gap: 10px
    }
    
    .me img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      background: #ddd
    }
    
    .me button {
      background: rgba(255, 255, 255, .18);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px
    }
    
    .list {
      padding: 18px 18px 40px;
      display: grid;
      gap: 14px
    }
    
    .lbstrip {
      margin: 16px 18px 0;
      background: var(--card);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      width: calc(100% - 36px);
      text-align: left
    }
    
    .lbstrip .lbtitle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: var(--ink);
      flex-shrink: 0
    }
    
    .lbstrip .lbtitle svg {
      width: 20px;
      height: 20px;
      color: var(--gold)
    }
    
    .lbstrip .lbtop3 {
      display: flex;
      flex: 1;
      justify-content: flex-end
    }
    
    .lbstrip .lbtop3 img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--card);
      margin-left: -9px;
      object-fit: cover;
      background: #ddd;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .15)
    }
    
    .lbstrip .lbtop3 img:first-child {
      margin-left: 0
    }
    
    .lbstrip .chev {
      color: #bbb;
      font-size: 20px;
      flex-shrink: 0
    }
    
    .lbview {
      padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px 30px;
      max-width: 560px;
      margin: 0 auto
    }
    
    .lbtabs {
      display: flex;
      gap: 8px;
      background: var(--line);
      border-radius: 999px;
      padding: 4px;
      margin: 16px 0 6px
    }
    
    .lbtabs button {
      flex: 1;
      padding: 9px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      color: var(--mute);
      background: none
    }
    
    .lbtabs button.on {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .12)
    }
    
    .lbrow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 6px;
      border-bottom: 1px solid var(--line);
      width: 100%;
      text-align: left;
      background: none;
      color: var(--ink)
    }
    
    .lbrow .rank {
      width: 26px;
      text-align: center;
      font-weight: 800;
      color: #aaa;
      flex-shrink: 0;
      font-size: 14px
    }
    
    .lbrow.top1 .rank,
    .lbrow.top2 .rank,
    .lbrow.top3 .rank {
      font-size: 18px
    }
    
    .lbrow img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      flex-shrink: 0
    }
    
    .lbrow .who {
      flex: 1;
      min-width: 0
    }
    
    .lbrow .who b {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14.5px
    }
    
    .lbrow .who span {
      font-size: 12px;
      color: var(--mute)
    }
    
    .lbrow .val {
      font-weight: 800;
      flex-shrink: 0;
      white-space: nowrap;
      color: var(--ink)
    }
    
    .lbrow.me {
      background: rgba(247, 197, 43, .16);
      border-radius: 14px
    }
    
    .lbsep {
      text-align: center;
      color: var(--mute);
      font-size: 13px;
      margin: 6px 0;
      letter-spacing: 2px
    }
    
    .game {
      background: var(--card);
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #e6e6e6;
      width: 100%;
      text-align: left
    }
    
    .game h3 {
      margin: 0;
      font-size: 18px
    }
    
    .game span {
      color: var(--mute);
      font-size: 13px
    }
    
    .game .ico {
      margin-right: 14px;
      color: var(--red);
      display: inline-flex;
      align-items: center
    }
    
    .game.soon {
      opacity: .55
    }
    
    .tag {
      font-size: 12px;
      background: #eee;
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--mute)
    }
    
    /* sheet */
    .sheet-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 10
    }
    
    .sheet {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 26px 26px 0 0;
      padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
      max-height: 80vh;
      overflow: auto
    }
    
    .sheet h2 {
      margin: 0 0 14px
    }
    
    .row {
      display: flex;
      gap: 10px;
      margin: 12px 0
    }
    
    input {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 13px 16px;
      border-radius: 999px;
      border: 2px solid #e2e2e2;
      text-transform: uppercase;
      letter-spacing: 2px
    }
    
    .room {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border-radius: 16px;
      padding: 10px 14px;
      margin-top: 8px
    }
    
    .room .btn {
      padding: 8px 18px
    }
    
    .empty {
      color: var(--mute);
      font-size: 14px;
      padding: 8px 2px
    }
    
    .pcbtn {
      flex: 1;
      padding: 10px 8px;
      font-size: 13px
    }
    
    .pcbtn.on {
      background: var(--red2);
      color: #fff;
      box-shadow: inset 0 0 0 2px #d4444b
    }
    
    /* game */
    .play {
      min-height: 100vh;
      color: #fff;
      background: repeating-conic-gradient(from 0deg at 50% 45%, #7a0c12 0 7deg, #9c1219 7deg 14deg);
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px
    }
    .play-layout { width:min(1480px,100%); display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:18px; align-items:start; }
    .game-main { min-width:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
    .game-rail { position:sticky; top:16px; order:-1; border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.28); border-radius:20px; padding:16px 14px; min-height:240px; backdrop-filter:blur(8px); }
    .game-rail h2 { margin:0 0 4px; font-size:18px; color:#fff; }
    .game-rail p { margin:0 0 16px; color:rgba(255,255,255,.7); font-size:12px; }
    .rail-lobby { width:100%; margin-bottom:14px; background:#fff; color:#7a0c12; border-radius:12px; padding:11px 12px; font-weight:800; }
    .rail-room { font-size:12px; padding:10px 0; border-top:1px solid rgba(255,255,255,.14); border-bottom:1px solid rgba(255,255,255,.14); }
    .rail-players { display:grid; gap:8px; margin-top:12px; }
    .rail-player { display:flex; align-items:center; gap:8px; font-size:12px; min-width:0; }
    .rail-player img { width:28px; height:28px; border-radius:50%; object-fit:cover; border:2px solid transparent; }
    .rail-player.turn img { border-color:var(--gold); }
    .rail-player span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .play-layout > .game-main > .bar { width:100%; }
    @media (max-width: 820px) { .play-layout { display:block; } .game-rail { display:none; } .game-main { width:100%; } }
    @media (min-width: 821px) { .play { padding-left:clamp(18px,3vw,44px); padding-right:clamp(18px,3vw,44px); } .game-main > .players { max-width:720px; } .game-main > #bd { max-width:900px; } }
    
    .bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center
    }
    
    .bar .back {
      background: rgba(0, 0, 0, .3);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 20px
    }
    
    .code {
      background: rgba(0, 0, 0, .35);
      border: 2px solid rgba(255, 255, 255, .25);
      border-radius: 12px;
      padding: 6px 14px;
      font-weight: 600
    }
    
    .players {
      width: 100%;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 4px
    }
    
    .pl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10.5px;
      width: 60px
    }
    
    .pl img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      border: 2px solid transparent
    }
    
    .pl.turn img {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(247, 197, 43, .35)
    }
    
    .pl.out {
      opacity: .45
    }
    
    .status {
      font-weight: 600;
      background: rgba(0, 0, 0, .35);
      border-radius: 999px;
      padding: 8px 20px;
      text-align: center
    }
    
    .board {
      background: #fff;
      color: var(--ink);
      border-radius: 20px;
      padding: 10px;
      display: grid;
      gap: 8px;
      width: 100%;
      max-width: 400px
    }
    
    .ttt {
      grid-template-columns: repeat(3, 1fr)
    }
    
    .cell {
      aspect-ratio: 1;
      border-radius: 14px;
      background: #f1f1f3;
      font-size: 44px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red)
    }
    
    .cell.o,
    .cell.p1 {
      color: #1f57b5
    }
    
    .cell.p0 {
      color: var(--red)
    }
    
    .cell.p2 {
      color: #1f8f4e
    }
    
    .cell.p3 {
      color: #c99a12
    }
    
    .tmark {
      font-size: 14px;
      margin-right: 2px
    }
    
    .tmark.p0 { color: var(--red) }
    .tmark.p1 { color: #5b8def }
    .tmark.p2 { color: #3fbf7a }
    .tmark.p3 { color: #e0b43a }
    
    .ttt-5 {
      gap: 7px;
      padding: 10px
    }
    
    .ttt-5 .cell {
      font-size: 26px;
      border-radius: 10px
    }
    
    .ttt .cell {
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease
    }
    
    .ttt .cell:not(:disabled):active {
      transform: scale(.92)
    }
    
    .ttt .cell.win {
      background: #fff3c4;
      box-shadow: inset 0 0 0 3px var(--gold);
      animation: tttWinGlow 1s ease-in-out infinite alternate
    }
    
    @keyframes tttWinGlow {
      from { box-shadow: inset 0 0 0 3px var(--gold) }
      to { box-shadow: inset 0 0 0 3px var(--gold), 0 0 14px var(--gold) }
    }
    
    .ttt .cell:disabled {
      opacity: 1
    }
    
    .cf {
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      background: #1f57b5;
      padding: 8px
    }
    
    .cf .cell {
      border-radius: 50%;
      background: #fff;
      font-size: 0;
      cursor: pointer
    }
    
    .cf .cell.a {
      background: var(--red2)
    }
    
    .cf .cell.b {
      background: var(--gold)
    }
    

    /* ---- chess ---- */
    .board.chess { display:grid; grid-template-columns:repeat(14,1fr); padding:0; gap:1px; width:min(96vw,520px); aspect-ratio:1; border-radius:16px; overflow:hidden; background:#27303a; box-shadow:0 12px 28px rgba(0,0,0,.18); }
    .chess .square { border:0; border-radius:0; min-width:0; min-height:0; aspect-ratio:1; padding:0; position:relative; display:flex; align-items:center; justify-content:center; font-size:clamp(13px,5.3vw,34px); line-height:1; font-family:"Noto Sans Symbols 2","DejaVu Sans",serif; text-shadow:0 2px 1px rgba(0,0,0,.2); }
    .chess .void { background:transparent; pointer-events:none; }
    .chess .square.light { background:#f0d9b5; } .chess .square.dark { background:#b58863; }
    .chess .square.selected { box-shadow:inset 0 0 0 5px #e8bd3e; background:#d6b34d; }
    .chess .square.target::after { content:""; width:22%; height:22%; border-radius:50%; background:rgba(40,40,40,.32); position:absolute; }
    .chess .square.capture::after { width:78%; height:78%; border:5px solid rgba(180,30,35,.72); background:transparent; }
    .chess .square.check { background:#d45b4d; }
    .chess .piece.p0 { color:#fff; } .chess .piece.p1 { color:#d74d52; } .chess .piece.p2 { color:#25232a; } .chess .piece.p3 { color:#2867c7; }
    .chess .square.check { background:#d45b4d; }
    .chess-coords { display:flex; justify-content:space-between; width:min(96vw,520px); padding:5px 8px 0; color:var(--mute); font-size:10px; font-weight:700; }
    .chess-promo { display:flex; gap:8px; justify-content:center; margin-top:10px; }
    .chess-wrap { position:relative; width:min(96vw,560px); padding:34px 42px; }
    .chess-wrap .board.chess { width:100%; }
    .chess-wrap .chess-coords { width:100% !important; }
    .chess-seat { position:absolute; z-index:3; display:flex; align-items:center; gap:6px; max-width:120px; color:#fff; font-size:10px; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.65); }
    .chess-seat img { width:30px; height:30px; border-radius:50%; object-fit:cover; background:#ddd; border:2px solid rgba(255,255,255,.8); box-shadow:0 2px 5px rgba(0,0,0,.3); }
    .chess-seat.you img { border-color:var(--gold); box-shadow:0 0 0 2px rgba(247,197,43,.45); }
    .chess-seat span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chess-seat.top { top:0; left:50%; transform:translateX(-50%); flex-direction:column; }
    .chess-seat.bottom { bottom:0; left:50%; transform:translateX(-50%); flex-direction:column; }
    .chess-seat.left { left:0; top:50%; transform:translateY(-50%); flex-direction:column; }
    .chess-seat.right { right:0; top:50%; transform:translateY(-50%); flex-direction:column; }
    @media(max-width:520px) { .chess-wrap { padding-left:34px; padding-right:34px; } .chess-seat { max-width:72px; font-size:9px; } .chess-seat img { width:27px; height:27px; } }
    .board.rpsboard { width:100%; padding:18px 14px 16px; display:flex; flex-direction:column; gap:15px; background:linear-gradient(145deg,#fff,#f5f5f8); border:1px solid var(--line); }
    .rps-score { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; width:100%; }
    .rps-player { background:var(--bg); border-radius:16px; padding:10px 8px; text-align:center; min-width:0; border:2px solid transparent; }
    .rps-player.you { border-color:var(--gold); background:rgba(247,197,43,.12); }
    .rps-player.waiting { border-color:var(--red2); }
    .rps-player b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .rps-player strong { display:block; color:var(--red); font-size:28px; line-height:1.1; }
    .rps-vs { color:var(--mute); font-size:11px; font-weight:800; }
    .rps-round { text-align:center; color:var(--mute); font-size:12px; font-weight:700; }
    .rps-prompt { text-align:center; font-weight:700; min-height:22px; }
    .rps { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; justify-content:center; }

    /* ---- ludo board v2: 15x15 grid matching classic board art ---- */
    .lgrid {

      justify-content: center;

      content: attr(data-n);
      position: absolute;
      top: -6px;
      right: -6px;
      background: #222;
      color: #fff;
      border-radius: 50%;

    /* ==== smooth animations & transitions, app-wide ==== */
    
    /* Every screen (login/lobby/leaderboard/settings/profile/game) fades and
       lifts in on mount instead of popping in instantly. */
    #app > *:not(.play) {
      animation: viewIn .22s ease both
    }
    
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(6px) }
      to { opacity: 1; transform: none }
    }
    
    /* Bottom sheets (game picker, rules) slide up + fade; their scrim fades in. */
    .sheet-bg {
      animation: scrimIn .18s ease both
    }
    
    .sheet {
      animation: sheetUp .24s cubic-bezier(.2, .8, .3, 1) both
    }
    
    @keyframes scrimIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }
    
    @keyframes sheetUp {
      from { opacity: 0; transform: translateY(28px) }
      to { opacity: 1; transform: none }
    }
    
    /* Match-over card and the leave/rules confirmation scrims scale + fade in. */
    .over-bg {
      animation: scrimIn .18s ease both
    }
    
    .over {
      animation: popIn .24s cubic-bezier(.2, .8, .3, 1) both
    }
    
    @keyframes popIn {
      from { opacity: 0; transform: scale(.92) }
      to { opacity: 1; transform: scale(1) }
    }
    
    /* Toast slides up + fades instead of appearing instantly. */
    #toast {
      animation: toastIn .2s ease both
    }

        if (ev.player === mine) toast(say('home'));
      }
      if (ev.type === 'timeout') {
        SFX.strike();
        const p = room.players[ev.player];
        toast(`${p ? nameOf(p) : 'Player'} missed their turn (${ev.strikes}/3)`);
      }
      if (ev.type === 'strikeout') {
        SFX.out();
        const p = room.players[ev.player];
        toast(`${p ? nameOf(p) : 'Player'} was removed — forfeited ${ev.coinsLost} coins`);
      }
    }
    
    function animateLudoMove(ev) {
      const { player, token, from, to } = ev;
      const st = gstate;
      if (!st || !st.colors || !st.colors[player]) return;
      const color = st.colors[player];
      const start = st.starts[player];
      const el = document.querySelector(`.ltok[data-color="${color}"][data-lt="${token}"]`);
      const hEl = document.querySelector(`[data-hscore="${player}"]`);
      if (hEl) hEl.classList.remove('counting', 'low'); // briefly show the score climbing instead of the countdown
      const seq = from === 0 ? [to] : Array.from({ length: Math.max(1, to - from) }, (_, k) => from + 1 + k);
      const stepDur = Math.max(90, Math.min(180, 600 / seq.length));
      animUntil = Math.max(animUntil, Date.now() + seq.length * stepDur + 120);
      SFX.move();
      let i = 0;
      (function tick() {
        if (el) {
          const { left, top } = ltokCoord(color, start, seq[i], token);
          el.style.left = left;
          el.style.top = top;
          el.style.transition = 'left .12s ease,top .12s ease,transform .12s ease';
          el.style.transform = 'translate(-50%,-50%) scale(1.3)';
          setTimeout(() => { if (el) el.style.transform = 'translate(-50%,-50%) scale(1)'; }, stepDur * 0.55);
        }
        i++;
        if (i < seq.length) setTimeout(tick, stepDur);
      })();
      const fromScore = ludoScoreDisplay[player] ?? 0;
      const homeBonus = to === 57 ? 56 : 0; // races a token all the way home: +56 bonus
      const toScore = fromScore + (from === 0 ? 1 : (to - from)) + homeBonus;
      ludoScoreDisplay[player] = toScore;
      if (hEl) animateNumber(hEl, fromScore, toScore, seq.length * stepDur);
    }
    
    function animateNumber(el, from, to, dur) {
      const t0 = performance.now();
      (function frame(t) {
        const p = Math.min(1, (t - t0) / Math.max(dur, 1));
        el.textContent = Math.round(from + (to - from) * p);
        if (p < 1) requestAnimationFrame(frame);
      })(t0);
    }

    function resizeImage(file, maxSide = 480, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > height && width > maxSide) { height = height / width * maxSide;
            width = maxSide; }
          else if (height > maxSide) { width = width / height * maxSide;
            height = maxSide; }
          const c = document.createElement('canvas');
          c.width = width;
          c.height = height;
          c.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

      try {

        voiceRecorder.ondataavailable = e => { if (e.data.size) voiceChunks.push(e.data); };
        voiceRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(voiceChunks, { type: voiceRecorder.mimeType || 'audio/webm' });
          if (blob.size > 500000) return toast('Voice note is too long. Keep it under 30 seconds.');
          const reader = new FileReader();
          reader.onload = () => { socket.emit('chat:voice', { code: room.code, audio: reader.result, mime: blob.type, duration: Math.round((Date.now() - voiceStartedAt) / 1000) }); };

      const buttons = [['rock','fist'], ['paper','palm'], ['scissors','scissors']].map(([key, ic]) => `<button data-rps="${key}" class="${selected === key ? 'sel' : ''}" ${locked || result ? 'disabled' : ''} aria-label="${RPS_LABELS[key]}">${icon(ic,34)}<span class="rps-choice-label">${RPS_LABELS[key]}</span></button>`).join('');
      const playerName = i => nameOf(players?.[i] || { name: i === mine ? 'You' : 'Opponent' });
      return `<div class="board rpsboard">
        <div class="rps-score"><div class="rps-player you ${locked?'waiting':''}"><b>${playerName(mine)}</b><strong>${st.scores?.[mine] || 0}</strong></div><span class="rps-vs">VS</span><div class="rps-player ${st.opponentPicked?'waiting':''}"><b>${playerName(opponent)}</b><strong>${st.scores?.[opponent] || 0}</strong></div></div>
        <div class="rps-round">Round ${st.round || 1} · First to 3 wins</div>
        <div class="rps-prompt" aria-live="polite">${esc(prompt)}</div>
        <div class="rps">${buttons}</div>
        <button id="rpsSubmit" class="rps-submit" ${!selected || locked || result ? 'disabled' : ''}>Lock in choice</button>
        ${lastHtml}
      </div>`;
    }
    const JOKER_SUITS = { hearts:'♥', diamonds:'♦', clubs:'♣', spades:'♠' };
    const JOKER_NUMBER_RANKS = new Set(['2','3','4','5','6','7','8','9','10']);
    const JOKER_SUIT_LABELS = { hearts:'Hearts', diamonds:'Diamonds', clubs:'Clubs', spades:'Spades' };
    let jokerPendingIndex = null;
    function jokerCardHtml(card, { index = null, big = false, playable = false } = {}) {
      if (!card) return '';
      const red = card.suit === 'hearts' || card.suit === 'diamonds';
      const wild = !!card.joker;
      return `<button class="jcard ${red?'red ':''}${wild?'jwild ':''}${big?'big ':''}${playable?'playable':''}" ${index != null ? `data-ji="${index}"` : ''} ${index != null && !playable ? 'disabled' : ''} aria-label="${wild?'Joker':`${card.rank} of ${card.suit}`}" style="${index == null ? 'cursor:default' : ''}">${wild ? '<span class="jwildmark">JOKER</span>' : `<span class="jr">${card.rank}</span><span class="jsuit">${JOKER_SUITS[card.suit]}</span><span class="jr bottom">${card.rank}</span>`}</button>`;
    }
    function jokerBoardHtml(st, myTurn, players = [], mine = -1) {
      const canAct = myTurn && !result;
      const hand = st.hand || [];
      const canPlay = c => st.pendingPick > 0 ? JOKER_NUMBER_RANKS.has(c.rank) : (c.joker || !st.topCard ? true : st.calledSuit ? c.suit === st.calledSuit : c.suit === st.topCard.suit || c.rank === st.topCard.rank);
      const handHtml = hand.map((c,i) => jokerCardHtml(c, { index:i, playable:canAct && canPlay(c) })).join('');
      const opponents = (st.handCounts || []).map((count,i) => i).filter(i => i !== mine).map(i => `<div class="jopp ${st.turn===i?'turn':''} ${st.active?.[i]===false?'out':''}"><span>${nameOf(players[i])}</span><strong>${st.handCounts[i]}</strong></div>`).join('');
      const picker = jokerPendingIndex != null ? `<div class="jsuitpicker"><b>Choose the next suit:</b>${Object.keys(JOKER_SUITS).map(s => `<button class="${s==='hearts'||s==='diamonds'?'red':''}" data-jsuit="${s}">${JOKER_SUITS[s]} ${JOKER_SUIT_LABELS[s]}</button>`).join('')}</div>` : '';
      const status = st.pendingPick > 0 ? `Penalty stack: ${st.pendingPick} — play a numbered card to add to it` : st.calledSuit ? `Wild suit: ${JOKER_SUIT_LABELS[st.calledSuit]}` : canAct ? 'Your turn — match the rank or suit' : `${nameOf(players[st.turn])}’s turn`;
      const marketDisabled = !canAct || hand.some(canPlay);
      return `<div class="board joker"><div class="jopps">${opponents}</div><div class="jstatus" aria-live="polite">${esc(status)}</div>${st.pendingPick ? '<div class="jpenalty">Number cards 2–10 can continue this stack.</div>' : ''}<div class="jtable"><div><button class="jmarket" data-jmarket="1" ${marketDisabled?'disabled':''}>DRAW</button><div class="jcaption">${st.pendingPick ? `Draw ${st.pendingPick}` : `Market ${st.marketCount ?? ''}`}</div></div><div>${jokerCardHtml(st.topCard,{big:true})}<div class="jcaption">Top card</div></div></div>${picker}<div class="jhand">${handHtml || '<span>No cards</span>'}</div></div>`;
    }
    function board(g, myTurn, players, mine, maxPlayers) {
      const b = gstate?.board || [];
      if (g === 'tictactoe') {
        const n = gstate?.size || TTT_SIZE_BY_PLAYERS[maxPlayers] || Math.round(Math.sqrt(b.length)) || 3;
        const win = new Set(gstate?.winLine || []);
        return `<div class="board ttt ttt-${n}" style="grid-template-columns:repeat(${n},1fr)">${b.flat().map((v,i)=>`<button class="cell p${v ?? ''}${win.has(i)?' win':''}" data-i="${i}" aria-label="${v==null?'Empty':esc(sym(v))} cell ${i+1}" ${result||!myTurn||sym(v)?'disabled':''}>${esc(sym(v))}</button>`).join('')}</div>`;
      }
      if (g === 'connectfour') {
        const rows = b.length,
          cols = b[0]?.length || 7;
        return `<div class="board cf" style="grid-template-columns:repeat(${cols},1fr)">${b.flat().map((v,i)=>`<button class="cell ${sym(v)||v===0||v===1?(side(v)?'b':'a'):''}" data-c="${i%cols}" ${result||!myTurn?'disabled':''} aria-label="Column ${i%cols+1}"></button>`).join('')}</div>`;
      }
      if (g === 'rps') return rpsBoardHtml(gstate || {}, mine, players);
      if (g === 'joker') return jokerBoardHtml(gstate || {}, myTurn, players, mine);
      if (g === 'ludo') {
        const st = gstate || {};
        if (!st.starts) return ludoBoardHtml({ colors: [], tokens: [], starts: [] }, mine, null, players);
        const canMove = result ? null : !myTurn ? null : st.dice == null ? 'roll' : 'move';
        return ludoBoardHtml(st, mine, canMove, players);
      }
      if (g === 'chess') return chessBoardHtml(gstate || {}, myTurn, mine, players);
      if (g === 'whot') return whotBoardHtml(gstate || {}, myTurn, players, mine);
      return '';
    }
    
    /* ---------- whot ---------- */
    const WHOT_SVG = {
      circle: '<circle cx="50" cy="50" r="40"/>',
      triangle: '<polygon points="50,8 94,88 6,88"/>',
      cross: '<path d="M36 6h28v30h30v28H64v30H36V64H6V36h30z"/>',
      square: '<rect x="12" y="12" width="76" height="76" rx="4"/>',
      star: '<polygon points="50,4 62,37 97,38 69,59 79,93 50,73 21,93 31,59 3,38 38,37"/>'
    };
    const whotShapeSvg = (shape, cls = 'wc-shape') => WHOT_SVG[shape] ? `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">${WHOT_SVG[shape]}</svg>` : '';
    function whotCardHtml(card, { index, disabled, big, playable } = {}) {
      const label = String(card.value);
      const centre = card.shape === 'whot' ? '<span class="wc-wild">WHOT</span>' : whotShapeSvg(card.shape);
      return `<button class="wcard s-${card.shape}${big?' big':''}${playable?' playable':''}" ${index!=null?`data-wi="${index}"`:''}
    ${disabled?'disabled':''} aria-label="${card.shape} ${card.value}"><span class="wc-idx tl">${label}</span>${centre}<span class="wc-idx br">${label}</span></button>`;
    }
    
    const whotBackHtml = (style = '') => `<span class="wback" style="${style}"><span class="wlabel">WHOT</span></span>`;
    
    function whotOppsHtml(st, players, mine) {
      const counts = st.handCounts || [];
      const opps = counts.map((c, i) => i).filter(i => i !== mine);
      if (!opps.length) return '';
      return `<div class="wopps">${opps.map(i => {
        const n = counts[i], shown = Math.min(n, 3), more = Math.max(0, n - shown), mid = (shown - 1) / 2;
        const fan = Array.from({ length: shown }, (_, k) => whotBackHtml(`transform:rotate(${((k - mid) * 7).toFixed(1)}deg)`)).join('');
        const out = st.active && st.active[i] === false;
        return `<div class="wopp${st.turn === i ? ' turn' : ''}"><div class="wopp-name">${esc(nameOf(players[i]))}<small>${out ? 'out' : n + (n === 1 ? ' card' : ' cards')}</small></div>
        <div class="wfan">${fan}${more ? `<span class="wfan-more">+${more}</span>` : ''}</div></div>`;
      }).join('')}</div>`;
    }
    
    function whotCardMatches(card, st) {
      if (card.shape === 'whot') return true;
      if (st.calledShape) return card.shape === st.calledShape;
      return !!st.topCard && (card.shape === st.topCard.shape || card.value === st.topCard.value);
    }
    
    function whotHasPlayable(st) {
      const hand = st.hand || [];
      if (st.pendingPick > 0) { const nv = st.pendingType === 'two' ? 2 : 3; return hand.some(c => c.value === nv); }
      return hand.some(c => whotCardMatches(c, st));
    }
    
    function whotBoardHtml(st, myTurn, players = [], mine = -1) {
      if (!st.topCard) return `<div class="board whot"></div>`;
      const canAct = myTurn && !result;
      const marketDisabled = !canAct || (st.pendingPick > 0 && whotHasPlayable(st));
      const hand = st.hand || [];
      const pendingVal = st.pendingType === 'two' ? 2 : 3;
      const handHtml = hand.map((c, i) => {
        const playable = canAct && (st.pendingPick > 0 ? c.value === pendingVal : whotCardMatches(c, st));
        return whotCardHtml(c, { index: i, disabled: !playable, big: false, playable });
      }).join('');
      const pickerHtml = whotPendingIndex != null ? `<div class="wpick">
      ${SHAPES_WHOT.map(s => `<button data-wshape="${s}">${whotShapeSvg(s, '')} ${s}</button>`).join('')}
      <button data-wcancel="1" style="background:none;color:#f4ecd2">Cancel</button>
    </div>` : '';
      return `<div class="board whot">
    ${whotOppsHtml(st, players, mine)}
    <div class="wtable">
      <div class="wpile"><button class="wmarket" data-wmarket="1" ${marketDisabled?'disabled':''} aria-label="Draw from market"><span class="wlabel">WHOT</span></button>
        <span class="wpile-cap">Market ${st.marketCount ?? ''}</span></div>
      <div class="wpile">${whotCardHtml(st.topCard, { big:true })}<span class="wpile-cap">${st.calledShape ? 'Calling: ' + st.calledShape : 'Top card'}</span></div>
    </div>
    ${pickerHtml}
    <div class="whand">${handHtml}</div>
  </div>`;
    }
    const SHAPES_WHOT = ['circle', 'triangle', 'cross', 'square', 'star'];
    
    const CHESS_GLYPHS = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
    const CHESS_NAMES = { p:'pawn', n:'knight', b:'bishop', r:'rook', q:'queen', k:'king' };
    let chessSelected = null;
    function chessBoardHtml(st, myTurn, mine, players = []) {
      const board = st.board || [], size = st.size || 14, selected = chessSelected != null ? chessSelected : -1;
      const targets = new Set((st.legal || []).filter(m => m.from === selected).map(m => m.to));
      const orient = size === 8 ? (mine === 1 ? 2 : 0) : (mine >= 0 ? mine : 0);
      const sideMap = size === 8 ? (orient === 2 ? ['top','bottom'] : ['bottom','top']) : (orient === 0 ? ['bottom','left','top','right'] : orient === 1 ? ['right','bottom','left','top'] : orient === 2 ? ['top','right','bottom','left'] : ['left','top','right','bottom']);
      const chessSeats = players.map((p, i) => p ? `<div class="chess-seat ${sideMap[i] || 'top'} ${i === mine ? 'you' : ''}"><img src="${avatar(p)}" alt=""><span>${nameOf(p)}${i === mine ? ' (you)' : ''}</span></div>` : '').join('');
      const isPlayable = (r,c) => size === 8 || (r >= 3 && r <= 10) || (c >= 3 && c <= 10);
      const squares = Array.from({ length: size * size }, (_, view) => {
        const vr = Math.floor(view / size), vc = view % size;
        // Standard chess: player 0 is at the bottom; rotate 180° for player 1.
        // Cross chess: rotate the board so the local player's side is always bottom.
        let r = vr, c = vc;
        if (orient === 1) { r = vc; c = size - 1 - vr; }
        else if (orient === 2) { r = size - 1 - vr; c = size - 1 - vc; }
        else if (orient === 3) { r = size - 1 - vc; c = vr; }
        const i = r * size + c, p = board[i];
        if (!isPlayable(r,c)) return '<span class="square void" aria-hidden="true"></span>';
        const target = targets.has(i), capture = target && p, check = st.check === i;
        return `<button class="square ${(vr+vc)%2?'dark':'light'} ${selected===i?'selected':''} ${target?'target':''} ${capture?'capture':''} ${check?'check':''}" data-chess="${i}" aria-label="${p ? CHESS_NAMES[p.type] : 'empty'} ${String.fromCharCode(97+c)}${r+1}">${p ? `<span class="piece p${p.player}">${CHESS_GLYPHS[p.type]}</span>` : ''}</button>`;
      }).join('');
      const coords = Array.from({length:size}, (_, i) => `<span>${String.fromCharCode(97 + i)}</span>`).join('');
      return `<div class="chess-wrap">${chessSeats}<div class="board chess" style="grid-template-columns:repeat(${size},1fr)">${squares}</div><div class="chess-coords">${coords}</div></div>`;
    }
    function bindBoard(g, myTurn) {
      const send = m => socket.emit(EV.move, { code: room.code, move: m });
      const act = m => { SFX.move();
        vibrate(18);
        send(m); };
      app.querySelectorAll('[data-i]').forEach(e => e.onclick = () => act(MOVE.tictactoe(+e.dataset.i)));
      app.querySelectorAll('[data-c]').forEach(e => e.onclick = () => act(MOVE.connectfour(+e.dataset.c)));
      app.querySelectorAll('[data-rps]').forEach(e => e.onclick = () => { picked = e.dataset.rps;
        SFX.tap();
        vibrate(18);
        gameView() });
      $('#rpsSubmit')?.addEventListener('click', () => { if (!picked || gstate?.mine) return;
        SFX.send();
        vibrate(24);
        send(MOVE.rps(picked));
      });
      app.querySelectorAll('[data-ji]:not([disabled])').forEach(e => e.onclick = () => {
        const index = +e.dataset.ji, card = gstate?.hand?.[index];
        if (!card) return;
        if (card.joker) { jokerPendingIndex = index; SFX.tap(); gameView(); return; }
        SFX.move(); vibrate(18); send({ type:'play', index });
      });
      app.querySelectorAll('[data-jsuit]').forEach(e => e.onclick = () => {
        if (jokerPendingIndex == null) return;
        SFX.send(); vibrate(18); send({ type:'play', index:jokerPendingIndex, calledSuit:e.dataset.jsuit }); jokerPendingIndex = null;
      });
      $('[data-jmarket]')?.addEventListener('click', () => { SFX.draw(); vibrate(18); send({ type:'market' }); });
      if (g === 'chess') app.querySelectorAll('[data-chess]').forEach(e => e.onclick = async () => {
        const to = +e.dataset.chess, board = gstate?.board || [], p = board[to];
        if (chessSelected == null) { if (p && p.player === room.you && myTurn) { chessSelected = to; gameView(); } return; }
        if (to === chessSelected) { chessSelected = null; gameView(); return; }
        const from = chessSelected; chessSelected = null;
        const moving = board[from];
        let promotion;
        const size = gstate?.size || 14, tr = Math.floor(to / size), tc = to % size;
        if (moving?.type === 'p' && (tr === 0 || tr === size - 1 || tc === 0 || tc === size - 1)) {
          const choice = await chooseDialog('Promote your pawn', 'Choose the piece your pawn becomes.', [
            { value:'q', label:'Queen' }, { value:'r', label:'Rook' }, { value:'b', label:'Bishop' }, { value:'n', label:'Knight' }
          ]);
          if (!choice) return;
          promotion = choice;
        }
        act({ from, to, ...(promotion ? { promotion } : {}) });
      });
      $('#roll')?.addEventListener('click', (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.querySelector('.ldice-face')?.classList.add('rolling');
        vibrate(15); // small tap — the disabled button never fires this on an opponent's turn
        send({ type: 'roll' });
      });
      app.querySelectorAll('[data-lt]:not([disabled])').forEach(e => e.onclick = () => { vibrate(18);
        send({ type: 'move', token: +e.dataset.lt }) });
      app.querySelectorAll('[data-wi]:not([disabled])').forEach(e => e.onclick = () => {
        const i = +e.dataset.wi;
        const card = gstate?.hand?.[i];
        if (card && card.shape === 'whot') { whotPendingIndex = i;
          SFX.tap();
          vibrate(15);
          gameView(); return; }
        act({ type: 'play', index: i });
      });
      app.querySelectorAll('[data-wshape]').forEach(e => e.onclick = () => {
        const calledShape = e.dataset.wshape;
        act({ type: 'play', index: whotPendingIndex, calledShape });
        whotPendingIndex = null;
      });
      $('[data-wcancel]')?.addEventListener('click', () => { whotPendingIndex = null;
        gameView(); });
      $('[data-wmarket]')?.addEventListener('click', () => { SFX.draw();
        vibrate(18);
        send({ type: 'market' }); });
    }
    
    function overCard(mine) {
      const w = result.winnerIndex ?? result.winner;
      const draw = w == null || result.status === 'draw';
      const won = !draw && w === mine;
      const maxPlayers = room.maxPlayers || room.players.length || 2;
      const canRe = room.players.length === maxPlayers && room.players.every(p => p.connected) && !room.rematch?.includes(mine);
      return `<div class="over-bg"><div class="over"><h2>${draw ? 'It’s a draw' : won ? `You won! ${icon('trophy',24)}` : 'You lost'}</h2>
    <p style="margin:0 0 14px;color:#6b6b76">${result.reason === 'forfeit' ? (won ? 'Someone left the match.' : 'You left or timed out.') : draw ? 'Nobody takes the coins.' : won ? 'Coins added to your total.' : 'Better luck next round.'}</p>
    <button class="btn" id="rm" style="margin-right:8px" ${canRe ? '' : 'disabled'}>${room.rematch?.includes(mine) ? 'Waiting…' : 'Rematch'}</button>
    <button class="btn ghost" id="again">Lobby</button></div></div>`;
    }
    
    boot();
    initInstallPrompt();
    
    /* ---------- install as app (PWA) ---------- */
    function initInstallPrompt() {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (isStandalone) return;
      if (sessionStorage.getItem('installDismissed')) return;
      
      const banner = document.createElement('div');
      banner.id = 'installBanner';
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      banner.innerHTML = `<img src="/icon-192.png" alt="">
    <div class="txt"><b>Install GameHub</b><span>${isIOS ? 'Tap Share, then “Add to Home Screen”' : 'Add it to your home screen for quick access'}</span></div>
    ${isIOS ? '' : '<button class="btn" id="installGo">Download</button>'}
    <button class="x" id="installX" aria-label="Dismiss">×</button>`;
      document.body.appendChild(banner);
      $('#installX').onclick = () => { banner.style.display = 'none';
        sessionStorage.setItem('installDismissed', '1'); };
      
      let deferred = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferred = e;
        banner.style.display = 'flex';
      });
      if (isIOS) banner.style.display = 'flex'; // no beforeinstallprompt on iOS Safari — show manual instructions instead
      $('#installGo')?.addEventListener('click', async () => {
        if (!deferred) return;
        deferred.prompt();
        const { outcome } = await deferred.userChoice;
        if (outcome === 'accepted') toast('Installing…');
        banner.style.display = 'none';
        deferred = null;
      });
      window.addEventListener('appinstalled', () => { banner.style.display = 'none';
        toast('GameHub installed'); });
    }
  </script>
</body>

</html>
