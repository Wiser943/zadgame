<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8f1017">
  <title>GameHub</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="/js/bgm.js"></script>
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #8f1017;
      --red2: #b3141c;
      --gold: #f7c52b;
      --bg: #f3f3f3;
      --ink: #1b1b1f;
      --mute: #6b6b76;
      --card: #fff;
      --line: #e6e6e6;
      --input-bg: #fff
    }
    
    html[data-theme="dark"] {
      --bg: #101014;
      --ink: #f1f1f4;
      --mute: #9a9aa4;
      --card: #1b1b22;
      --line: #2c2c35;
      --input-bg: #23232c
    }
    
    html[data-theme="dark"] .top,
    html[data-theme="dark"] .pcover {
      background: linear-gradient(160deg, #4a070c, #7a0f16)
    }
    
    html[data-theme="dark"] input {
      background: var(--input-bg);
      color: var(--ink);
      border-color: #3a3a45
    }
    
    html[data-theme="dark"] .cell {
      background: #23232c
    }
    
    html[data-theme="dark"] .lrow {
      background: #1b1b22
    }
    
    html[data-theme="dark"] .sheet,
    html[data-theme="dark"] .over,
    html[data-theme="dark"] .game,
    html[data-theme="dark"] .room,
    html[data-theme="dark"] .pstat {
      background: var(--card);
      color: var(--ink);
      border-color: var(--line)
    }
    
    html[data-theme="dark"] .btn.ghost {
      background: var(--card);
      color: var(--ink);
      box-shadow: inset 0 0 0 2px var(--line)
    }
    
    html[data-theme="dark"] .room {
      background: #23232c
    }
    
    html[data-theme="dark"] .tag {
      background: #2c2c35;
      color: var(--mute)
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }
    
    html,
    body {
      margin: 0;
      height: 100%;
      font-family: Poppins, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      transition: background .2s ease, color .2s ease
    }
    
    button {
      font: inherit;
      cursor: pointer;
      border: 0
    }
    
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }
    
    #app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100%;
      position: relative
    }
    
    .btn {
      background: var(--red2);
      color: #fff;
      font-weight: 600;
      padding: 14px 22px;
      border-radius: 999px;
      box-shadow: inset 0 0 0 2px #d4444b
    }
    
    .btn.ghost {
      background: #fff;
      color: var(--red);
      box-shadow: inset 0 0 0 2px #e9c4c6
    }
    
    .btn:disabled {
      opacity: .5
    }

    /* spotlight tour */
    #tourLayer { position: fixed; inset: 0; z-index: 10000; }
    #tourLayer .tour-block { position: absolute; inset: 0; }
    #tourLayer .tour-hole { position: fixed; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(8, 4, 6, .72); outline: 3px solid #f7c52b; pointer-events: none; transition: top .25s, left .25s, width .25s, height .25s; }
    #tourLayer .tour-card { position: fixed; background: var(--card); color: var(--ink); border-radius: 18px; padding: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .45); }
    #tourLayer .tour-card h3 { margin: 4px 0 6px; font-size: 18px; }
    #tourLayer .tour-card p { margin: 0 0 12px; font-size: 14px; line-height: 1.45; color: var(--mute); }
    #tourLayer .tour-step { font-size: 12px; color: var(--mute); font-weight: 700; }
    #tourLayer .tour-dots { display: flex; gap: 5px; margin-bottom: 12px; }
    #tourLayer .tour-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
    #tourLayer .tour-dots i.on { background: var(--red2); }
    #tourLayer .tour-actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    #tourLayer .tour-skip { background: none; color: var(--mute); font-weight: 700; padding: 10px 6px; }
    #tourLayer .tour-next { padding: 11px 24px; }
    html.reduced-motion #tourLayer .tour-hole { transition: none; }
    @media (prefers-reduced-motion: reduce) { #tourLayer .tour-hole { transition: none; } }

    /* lobby tabs */
    .lobtabs { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
    .lobtabs [role=tab] { flex: 1; padding: 11px 6px; border-radius: 999px; font-weight: 700; font-size: 14px; background: var(--card); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
    .lobtabs [role=tab].on { background: var(--red2); color: #fff; border-color: var(--red2); }
    .lobtabs [role=tab]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    [role=tabpanel][hidden] { display: none; }
    #pnTour .soc { padding-top: 6px; }
    .ckcell.can { box-shadow: inset 0 0 0 3px #f7c52b; }

    .rpbox { display:flex; justify-content:center; margin:10px 0; pointer-events:none; overflow:auto }
    .rpbar { display:flex; gap:8px; align-items:center; justify-content:center; margin:8px 0 }
    .rpbar button { padding:9px 14px; border-radius:99px; background:var(--red2); color:#fff; font-weight:700; font-size:14px }
    .rpbar button.alt { background:var(--line); color:var(--ink) }
    .rprange { width:100%; margin:6px 0 }

    /* accessibility */
    html.hc { --bg:#000; --ink:#fff; --mute:#e6e6e6; --card:#0b0b0b; --line:#fff; --input-bg:#000; --gold:#ffe14d }
    html.hc .btn { box-shadow: inset 0 0 0 3px #fff }
    html.hc .prow, html.hc .chcard, html.hc .dash, html.hc .rwstrip { border:2px solid #fff }
    html.largetext { font-size: 118% }
    html.largetext .btn, html.largetext .prow { font-size: 1.05em }
    html.cb-safe .res.w, html.cb-safe .tier-Gold { background:#0072b233; color:#56b4e9 }
    html.cb-safe .res.l { background:#d55e0033; color:#e69f00 }
    html:focus-within :focus-visible, :focus-visible { outline:3px solid #f7c52b; outline-offset:2px }
    /* tournaments, ranked queue, bot level */
    .qoverlay { position:fixed; inset:0; z-index:10000; background:rgba(8,8,12,.88); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; text-align:center; padding:24px }
    .qoverlay .spin { width:54px; height:54px; border-radius:50%; border:5px solid rgba(255,255,255,.2); border-top-color:#f7c52b; animation:qspin 1s linear infinite }
    @keyframes qspin { to { transform:rotate(360deg) } }
    .reduced-motion .qoverlay .spin { animation:none }
    .diffrow { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px }
    .diffrow select { flex:1; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink) }
    .tcard { padding:12px 14px; margin-bottom:8px; border-radius:16px; background:var(--card); border:1px solid var(--line); cursor:pointer }
    .tcard .tt { display:flex; justify-content:space-between; gap:8px; font-weight:700; font-size:14px }
    .tcard small { color:var(--mute); font-size:12px }
    .tstat { font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; background:var(--line) }
    .tstat.open { background:rgba(46,184,114,.2); color:#2eb872 } .tstat.running { background:rgba(247,197,43,.25); color:#c98f00 }
    .bracket { display:flex; gap:14px; overflow-x:auto; padding-bottom:8px }
    .bround { min-width:150px; display:flex; flex-direction:column; justify-content:space-around; gap:10px }
    .bround h4 { margin:0 0 4px; font-size:12px; color:var(--mute); text-align:center }
    .bmatch { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); font-size:13px }
    .bmatch.mine { border-color:#f7c52b; box-shadow:0 0 0 1px #f7c52b }
    .bmatch div { padding:7px 10px; display:flex; justify-content:space-between; gap:6px }
    .bmatch div + div { border-top:1px solid var(--line) }
    .bmatch .win { font-weight:800; color:#2eb872 } .bmatch .tbd { color:var(--mute); font-style:italic }
    .tform { display:flex; flex-direction:column; gap:10px; margin:10px 0 16px; padding:14px; border-radius:16px; background:var(--card); border:1px solid var(--line) }
    .tform select, .tform input { padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:14px }
    .mutebtn { margin-left:6px; font-size:11px; opacity:.6; background:transparent; color:inherit; text-decoration:underline }

    .dash { margin:12px 18px 0; padding:14px 16px; border-radius:20px; background:var(--card); border:1px solid var(--line) }
    .dash .row1 { display:flex; align-items:center; gap:10px; justify-content:space-between }
    .dash .lvl { font-weight:800; font-size:15px }
    .dash .xpbar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin:8px 0 4px }
    .dash .xpbar i { display:block; height:100%; background:linear-gradient(90deg,#f7c52b,#ff9d2e) }
    .dash small { color:var(--mute); font-size:12px }
    .rankchip { font-size:12px; font-weight:800; padding:4px 10px; border-radius:99px; background:rgba(247,197,43,.2); color:#c98f00 }
    .dstats { display:flex; gap:8px; margin-top:10px }
    .dstats > div { flex:1; text-align:center; padding:8px 4px; border-radius:12px; background:var(--line) }
    .dstats b { display:block; font-size:16px }
    .dstats span { font-size:11px; color:var(--mute) }
    .dform { display:flex; gap:6px; margin-top:10px; align-items:center; font-size:12px; color:var(--mute); flex-wrap:wrap }
    .dform .res { font-size:11px }
    .dlink { margin-top:10px; width:100%; padding:9px; border-radius:12px; background:var(--line); color:var(--ink); font-weight:700; font-size:13px }
    .invbanner { position:fixed; left:12px; right:12px; top:12px; z-index:9999; max-width:496px; margin:0 auto; padding:12px 14px; border-radius:16px; background:#1b1c22; color:#fff; box-shadow:0 8px 30px rgba(0,0,0,.4); display:flex; align-items:center; gap:10px }
    .invbanner span { flex:1; font-size:14px }
    .invbanner button { padding:8px 14px; border-radius:99px; font-weight:700; font-size:12px; background:#f7c52b; color:#1a0508 }
    .invbanner button.x { background:transparent; color:#fff; opacity:.7 }
    .tierbadge { display:inline-block; font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px }
    .tier-Bronze { background:#cd7f3233; color:#cd7f32 } .tier-Silver { background:#c0c0c033; color:#9aa0a6 } .tier-Gold { background:#f7c52b33; color:#c98f00 } .tier-Legendary { background:#a855f733; color:#a855f7 } .tier-none { background:var(--line); color:var(--mute) }

    /* friends / history / challenges */
    .chcard { margin:16px 18px 0; padding:14px 16px; border-radius:20px; background:var(--card); border:1px solid var(--line) }
    .chcard h3 { margin:0 0 8px; font-size:15px }
    .chrow { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line) }
    .chrow:first-of-type { border-top:0 }
    .chrow .t { flex:1; min-width:0; font-size:14px } .chrow .t small { display:block; color:var(--mute); font-size:12px }
    .chbar { height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:5px }
    .chbar i { display:block; height:100%; background:#f7c52b }
    .chbtn { padding:7px 12px; border-radius:99px; font-size:12px; font-weight:700; background:var(--red2); color:#fff }
    .chbtn:disabled { opacity:.45 }
    .soc { padding:18px } .soc h1 { margin:0; flex:1; font-size:22px }
    .soctabs { display:flex; gap:6px; margin:12px 0; overflow-x:auto }
    .soctabs button { padding:8px 14px; border-radius:99px; background:var(--card); border:1px solid var(--line); color:var(--ink); font-size:13px; font-weight:600; white-space:nowrap }
    .soctabs button.on { background:var(--red2); color:#fff; border-color:var(--red2) }
    .prow { display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:8px; border-radius:16px; background:var(--card); border:1px solid var(--line) }
    .prow img { width:44px; height:44px; border-radius:50%; object-fit:cover; flex:none }
    .prow .t { flex:1; min-width:0 } .prow .t b { display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .prow .t small { color:var(--mute); font-size:12px }
    .prow .acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end }
    .prow .acts button { padding:7px 11px; border-radius:99px; font-size:12px; font-weight:700; background:var(--red2); color:#fff }
    .prow .acts button.alt { background:var(--line); color:var(--ink) }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#9aa0a6; margin-right:5px }
    .dot.on { background:#2eb872 }
    .socsearch { width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; margin-bottom:10px }
    .socempty { text-align:center; color:var(--mute); padding:28px 0; font-size:14px }
    .res { font-weight:800; font-size:12px; padding:4px 9px; border-radius:99px }
    .res.w { background:rgba(40,160,90,.18); color:#2eb872 } .res.l { background:rgba(220,60,60,.18); color:#e05555 } .res.d { background:var(--line); color:var(--mute) }

    /* rewards: coming soon */
    .rwstrip { margin:16px 18px 0; width:calc(100% - 36px); display:flex; align-items:center; gap:12px; text-align:left;
      padding:14px 16px; border-radius:20px; border:1px dashed #d9a441; background:linear-gradient(135deg, rgba(247,197,43,.14), rgba(247,197,43,.04)); color:var(--ink) }
    .rwstrip .rwico { font-size:24px }
    .rwstrip .rwtxt { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0 }
    .rwstrip small { font-size:12px; opacity:.75 }
    .rwbadge { background:#f7c52b; color:#1a0508; font-weight:800; font-size:11px; padding:5px 10px; border-radius:999px; white-space:nowrap }
    .rwview { padding:18px }
    .rwview h1 { margin:0; flex:1; font-size:22px }
    .rwhero { margin:14px 0; padding:18px; border-radius:20px; background:var(--card); border:1px solid var(--line); text-align:center }
    .rwhero .big { font-size:40px } .rwhero p { margin:8px 0 0; color:var(--mute); font-size:14px; line-height:1.45 }
    .rwform { display:flex; flex-direction:column; gap:12px; margin-top:6px }
    .rwform label { font-size:13px; font-weight:600; display:flex; flex-direction:column; gap:6px }
    .rwform input[type=text], .rwform select { padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px }
    .rwform .chk { flex-direction:row; align-items:flex-start; gap:10px; font-weight:500; line-height:1.35 }
    .rwform .chk input { margin-top:3px }
    .rwnote { font-size:12px; color:var(--mute); line-height:1.45; padding:10px 12px; border-radius:12px; background:var(--card); border:1px solid var(--line) }
    .rwdone { padding:12px 14px; border-radius:14px; background:rgba(40,160,90,.12); border:1px solid rgba(40,160,90,.4); font-size:14px }

    /* quick actions: side-by-side tiles */
    .quickgrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 18px 0;
    }
    .btn.qtile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 14px 10px;
      border-radius: 18px;
      text-align: center;
      min-height: 92px;
    }
    .qtile .qico { font-size: 22px; line-height: 1; display: inline-flex; }
    .qtile b { font-size: 15px; font-weight: 700; }
    .qtile small { font-size: 12px; opacity: .75; line-height: 1.25; }
    html[data-theme="dark"] .qtile small { opacity: .8; }
    
    /* login */
    .login {
      min-height: 100vh;
      background: var(--red);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      text-align: center
    }
    
    .login h1 {
      font-size: 44px;
      font-weight: 800;
      margin: 0;
      color: var(--gold);
      letter-spacing: -1px;
      text-shadow: 0 4px 0 #6d0a10
    }
    
    .login p {
      margin: 0;
      opacity: .85
    }
    
    .login {
      --ink: #1b1b1f; --mute: #6b6b76; --card: #fff; --line: #e6e6e6; --input-bg: #fff;
      color-scheme: light
    }
    .login .btn, html[data-theme="dark"] .login .btn {
      background: #fff;
      color: #1b1b1f;
      box-shadow: none;
      padding: 14px 26px
    }
    .login .btn:disabled { opacity: .6 }
    .login input.plain, html[data-theme="dark"] .login input.plain {
      background: #fff;
      color: #1b1b1f;
      border: 0;
      width: 100%;
      -webkit-text-fill-color: #1b1b1f
    }
    .login input.plain::placeholder { color: #8a8a93; opacity: 1; -webkit-text-fill-color: #8a8a93 }
    .login input.plain:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #fff inset; -webkit-text-fill-color: #1b1b1f }
    
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 320px;
      color: rgba(255, 255, 255, .65);
      font-size: 13px
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, .25)
    }
    
    .login form {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }
    
    .login input.plain {
      text-transform: none;
      letter-spacing: normal;
      border: 0
    }
    
    .err {
      color: #ffe3e3;
      background: rgba(0, 0, 0, .28);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 13px;
      width: 100%;
      max-width: 320px
    }
    
    .switch {
      font-size: 14px;
      opacity: .9
    }
    
    .switch button {
      background: none;
      color: var(--gold);
      text-decoration: underline;
      padding: 0;
      font-weight: 600
    }
    
    /* lobby */
    .top {
      background: linear-gradient(160deg, #6d0a10, #b3141c);
      color: #fff;
      padding: calc(env(safe-area-inset-top, 0px) + 22px) 22px 26px;
      border-radius: 0 0 28px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }
    
    .top small {
      opacity: .8;
      font-size: 13px
    }
    
    .top b {
      display: block;
      font-size: 34px;
      font-weight: 700
    }
    
    .me {
      display: flex;
      align-items: center;
      gap: 10px
    }
    
    .me img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      background: #ddd
    }
    
    .me button {
      background: rgba(255, 255, 255, .18);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px
    }
    
    .list {
      padding: 18px 18px 40px;
      display: grid;
      gap: 14px
    }
    
    .lbstrip {
      margin: 16px 18px 0;
      background: var(--card);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      width: calc(100% - 36px);
      text-align: left
    }
    
    .lbstrip .lbtitle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: var(--ink);
      flex-shrink: 0
    }
    
    .lbstrip .lbtitle svg {
      width: 20px;
      height: 20px;
      color: var(--gold)
    }
    
    .lbstrip .lbtop3 {
      display: flex;
      flex: 1;
      justify-content: flex-end
    }
    
    .lbstrip .lbtop3 img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--card);
      margin-left: -9px;
      object-fit: cover;
      background: #ddd;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .15)
    }
    
    .lbstrip .lbtop3 img:first-child {
      margin-left: 0
    }
    
    .lbstrip .chev {
      color: #bbb;
      font-size: 20px;
      flex-shrink: 0
    }
    
    .lbview {
      padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px 30px;
      max-width: 560px;
      margin: 0 auto
    }
    
    .lbtabs {
      display: flex;
      gap: 8px;
      background: var(--line);
      border-radius: 999px;
      padding: 4px;
      margin: 16px 0 6px
    }
    
    .lbtabs button {
      flex: 1;
      padding: 9px;
      border-radius: 999px;

    /* ---- ludo board v2: 15x15 grid matching classic board art ---- */
    .lgrid {

      background: #fff;

    .lquad {
      position: absolute;
      width: 40%;

      display: flex;

      justify-content: center
    }
    
    .lquad.red {
      top: 0;
      left: 0;
      background: #c0272d
    }
    
    .lquad.green {
      top: 0;
      right: 0;
      background: #1f8f4e
    }
    
    .lquad.yellow {
      bottom: 0;
      right: 0;
      background: #d8a913
    }
    
    .lquad.blue {
      bottom: 0;
      left: 0;
      background: #1f57b5
    }
    
    .lquad .ring {
      width: 56%;
      height: 56%;
      border-radius: 50%;
      background: rgba(255, 255, 255, .9);
      display: flex;
      align-items: center;
      justify-content: center
    }
    
    .lquad .ring i {
      width: 66%;
      height: 66%;
      border-radius: 50%;
      display: block
    }

      background: #c0272d
    }
    
    .lquad.green .ring i {
      background: #1f8f4e
    }
    
    .lquad.blue .ring i {
      background: #1f57b5
    }
    
    .lquad.yellow .ring i {
      background: #d8a913
    }
    
    .lquad .yard {
      position: absolute;
      inset: 8%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6%;
      pointer-events: none
    }
    
    .lquad .yard .slot {
      border-radius: 50%;
      background: rgba(255, 255, 255, .35);
      display: flex;
      align-items: center;
      justify-content: center
    }
    
    .lquad .lseat {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      max-width: 92%;
      pointer-events: none;
      z-index: 6

    }

    /* ---- ludo screen: corner avatars, house score rings, big dice (matches reference art) ---- */

    .lquad.red { --hc: #c0272d }

    /* playable tokens: high-contrast double ring, visible on white cells and coloured yards alike */

    /* ---- room background themes (bought in the Shop) ---- */
    html[data-roombg="midnight"] .play { background: repeating-conic-gradient(from 0deg at 50% 45%, #0a1b3f 0 7deg, #1d3f85 7deg 14deg); }
    html[data-roombg="emerald"]  .play { background: repeating-conic-gradient(from 0deg at 50% 45%, #08382a 0 7deg, #12744f 7deg 14deg); }

    html[data-roombg="ocean"]    .play { background: repeating-conic-gradient(from 0deg at 50% 45%, #04303f 0 7deg, #0b6b82 7deg 14deg); }

    html[data-roombg="aurora"]   .play { background: repeating-conic-gradient(from 0deg at 50% 45%, #0b3d3a 0 7deg, #5b2a86 7deg 14deg); }

    /* ---- board skins (bought in the Shop). Selectors are on the attribute alone so Shop previews can reuse them. ---- */
    [data-boardskin="marble"] .chess .square.light:not(.selected):not(.check) { background:#eceff3; } [data-boardskin="marble"] .chess .square.dark:not(.selected):not(.check) { background:#8a93a0; }

    [data-boardskin="regal"] .ckcell.light { background:#f6e2a3; } [data-boardskin="regal"] .ckcell.dark { background:#7a4a1a; }

    [data-boardskin="regal"] .cf, [data-boardskin="regal"] .mboard { background:#7a4a1a; }

    /* ---- token skins (bought in the Shop): Ludo tokens, Connect Four discs, Checkers pieces ---- */
    [data-tokenskin="glass"] .ltok, [data-tokenskin="glass"] .cf .cell.a, [data-tokenskin="glass"] .cf .cell.b { background-image:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,.25) 36%,rgba(255,255,255,0) 60%),linear-gradient(160deg,rgba(255,255,255,.28),rgba(0,0,0,.18)); border-color:rgba(255,255,255,.9); }

    /* ---- shop ---- */
    .shop { padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px; max-width:560px; margin:0 auto; }
    .shop-top { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .shop-top h1 { flex:1; margin:0; font-size:22px; }
    .shop-coins { font-weight:800; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 14px; }
    .shop-tabs { display:flex; gap:6px; margin:10px 0 14px; }
    .shop-tabs button { flex:1; padding:9px 4px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-weight:700; font-size:12px; }
    .shop-tabs button.on { background:var(--red2); color:#fff; border-color:var(--red2); }
    .shop-hint { font-size:12px; color:var(--mute); margin:0 2px 12px; line-height:1.4; }
    .shop-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .shop-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px; display:flex; flex-direction:column; gap:7px; }
    .shop-card.eq { box-shadow:0 0 0 2px var(--gold); }
    .shop-prev { height:88px; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:10px; }
    .shop-card b { font-size:14px; } .shop-card .price { font-size:12px; color:var(--mute); }
    .shop-card .act { padding:9px; border-radius:10px; font-weight:800; font-size:13px; border:0; background:var(--red2); color:#fff; }
    .shop-card .act.own { background:var(--line); color:var(--ink); } .shop-card .act.on { background:var(--gold); color:#3a2b00; } .shop-card .act.poor { background:var(--line); color:var(--mute); }
    .skin-prev .ltok { position:static; width:34px; height:34px; transform:none; transition:none; flex:none; }
    .mini-board { display:grid; grid-template-columns:repeat(4,24px); border-radius:6px; overflow:hidden; }
    .mini-board .square { width:24px; height:24px; display:block; border:0; padding:0; border-radius:0; }
    .bm-badge { width:100%; margin:14px 0 4px; padding:12px; border-radius:14px; border:0; font-weight:800; background:linear-gradient(90deg,#f7c52b,#e0a100); color:#2a1a00; }

    /* ---- word clash tiles: letter values ---- */
    .wv { position:absolute; right:5px; bottom:3px; font-size:9px; font-weight:800; opacity:.7; font-style:normal; }
    .wmeta { font-size:11px; color:var(--mute); letter-spacing:.4px; }

    /* ---- cinematic winner highlights (CODM-style) ---- */
    #hlCinema { position:fixed; inset:0; z-index:60; background:#05060a; color:#fff; overflow:hidden; font-family:inherit; animation:hlFadeIn .35s ease both; user-select:none; }
    #hlCinema.out { animation:hlFadeOut .4s ease both; }
    @keyframes hlFadeIn { from{opacity:0} to{opacity:1} }
    @keyframes hlFadeOut { from{opacity:1} to{opacity:0} }
    #hlCinema .hl-bg { position:absolute; left:50%; top:50%; width:240vmax; height:240vmax; margin:-120vmax 0 0 -120vmax; background:radial-gradient(circle at 50% 50%, rgba(247,197,43,.22), transparent 14%), repeating-conic-gradient(from 0deg at 50% 50%, #1a0508 0 6deg, #2a0a10 6deg 12deg); animation:hlSpin 24s linear infinite; }

    /* ==== smooth animations & transitions, app-wide ==== */
    
    /* Every screen (login/lobby/leaderboard/settings/profile/game) fades and
       lifts in on mount instead of popping in instantly. */
    #app > *:not(.play) {
      animation: viewIn .22s ease both
    }
    
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(6px) }
      to { opacity: 1; transform: none }
    }
    
    /* Bottom sheets (game picker, rules) slide up + fade; their scrim fades in. */
    .sheet-bg {
      animation: scrimIn .18s ease both
    }
    
    .sheet {
      animation: sheetUp .24s cubic-bezier(.2, .8, .3, 1) both
    }
    
    @keyframes scrimIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }
    
    @keyframes sheetUp {
      from { opacity: 0; transform: translateY(28px) }
      to { opacity: 1; transform: none }
    }
    
    /* Match-over card and the leave/rules confirmation scrims scale + fade in. */
    .over-bg {
      animation: scrimIn .18s ease both
    }
    
    .over {
      animation: popIn .24s cubic-bezier(.2, .8, .3, 1) both
    }
    
    @keyframes popIn {
      from { opacity: 0; transform: scale(.92) }
      to { opacity: 1; transform: scale(1) }
    }
    
    /* Toast slides up + fades instead of appearing instantly. */
    #toast {
      animation: toastIn .2s ease both
    }
    .custom-dialog-bg { position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(10,12,18,.62); backdrop-filter:blur(5px); animation:scrimIn .16s ease both; }
    .custom-dialog { width:min(100%,390px); border:1px solid rgba(255,255,255,.16); border-radius:22px; padding:22px; color:var(--ink); background:var(--card); box-shadow:0 20px 60px rgba(0,0,0,.28); animation:popIn .2s cubic-bezier(.2,.8,.3,1) both; }
    .custom-dialog h3 { margin:0 0 8px; font-size:20px; } .custom-dialog p { margin:0; color:var(--mute); line-height:1.5; font-size:14px; }
    .custom-dialog-actions { display:flex; justify-content:flex-end; gap:9px; flex-wrap:wrap; margin-top:20px; }
    .custom-dialog-actions button { border:0; border-radius:12px; padding:11px 16px; font:inherit; font-weight:800; cursor:pointer; background:var(--red2); color:#fff; }
    .custom-dialog-actions button.cancel { background:var(--line); color:var(--ink); }
    .custom-dialog-actions button.choice { min-width:112px; }
    
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 10px) }
      to { opacity: 1; transform: translate(-50%, 0) }
    }
    
    /* Tactile press feedback across every tappable surface in the app. */
    .btn, .game, .room, .pcbtn, .lbrow, .lbstrip, .pl, .cell, .wcard,
    .wmarket, .ldice, .emotes button, .chatform button {
      transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease
    }
    
    .btn:not(:disabled):active, .game:active, .room .btn:not(:disabled):active,
    .pcbtn:not(:disabled):active, .lbrow:active, .wmarket:not(:disabled):active,
    .emotes button:active {
      transform: scale(.95)
    }
    
    /* New marks/discs/cards pop or drop into place as they're placed. */
    .cell.p0, .cell.p1, .cell.p2, .cell.p3 {
      animation: none
    }
    
    @keyframes markPop {
      from { transform: scale(.4); opacity: 0 }
      to { transform: scale(1); opacity: 1 }
    }
    
    .cf .cell.a, .cf .cell.b {
      animation: none
    }
    
    @keyframes discDrop {
      from { transform: translateY(-140%); opacity: 0 }
      to { transform: translateY(0); opacity: 1 }
    }
    
    .wcard {
      animation: none
    }
    
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px) scale(.94) }
      to { opacity: 1; transform: none }
    }
    

    /* ---- chat: keyboard icon dock + incoming message toasts ---- */
    #chatDock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; pointer-events: none; display: none }
    #chatDock.on { display: block }
    .chatkb {
      position: absolute; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      width: 44px; height: 44px; padding: 0; border-radius: 50%;

      display: flex; align-items: center; justify-content: center; pointer-events: auto
    }
    .chatkb:active { transform: scale(.92) }
    .chatpanel {
      display: none; pointer-events: auto; margin: 0 auto; max-width: 420px;
      padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
      background: rgba(30, 0, 4, .88); border-radius: 16px 16px 0 0
    }

    .chatline { max-width:86%; align-self:flex-start; padding:7px 10px; border-radius:12px 12px 12px 3px; background:rgba(255,255,255,.12); color:#fff; font-size:13px; line-height:1.3; }

    .chatline audio { display:block; max-width:210px; height:32px; margin-top:3px; }
    #chatDock.open .chatpanel { display: block }
    #chatDock.open .chatkb { display: none }
    #chatDock .chatform button { background: #d11f2a; color: #fff; border: 0 }
    .chatform input, .chatform input:focus { outline:none !important; box-shadow:none; }
    .voicebtn { min-width:42px; padding:0 10px !important; }
    #msgToasts {
      position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 25;
      display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none
    }
    .msgtoast {
      pointer-events: auto; max-width: 80%; background: rgba(20, 20, 24, .92); color: #fff;
      padding: 7px 14px; border-radius: 14px; font-size: 13px; display: flex; gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35); animation: toastDown .2s ease both; transition: opacity .25s
    }
    .msgtoast b { color: var(--gold); white-space: nowrap }
    .msgtoast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .msgtoast.out { opacity: 0 }
    @keyframes toastDown { from { opacity: 0; transform: translateY(-8px) } to { opacity: 1; transform: none } }

    /* Accessibility: anyone who asks for reduced motion gets near-instant,
       non-looping transitions everywhere — including everything added above. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important
      }
    }

    .dominoes{width:min(94vw,520px);padding:18px}.domchain{min-height:80px;border:2px dashed var(--line);border-radius:12px;padding:18px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:center}.domchain span,.domhand button{background:#fff;border:1px solid #d7c7aa;border-radius:8px;padding:10px;color:#222;font-weight:700}.domhand{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:20px}.spectator-badge{color:#f7c52b}.progress{margin:12px 18px;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}.progress b{color:var(--red2)}

    /* =====================================================================
       UI polish pass: dark mode, form controls, sheets, rooms tab, tour,
       settings rows, rewards form, multiplayer boards, watermark
       ===================================================================== */
    :root { --board-bg: #fff; --field-line: #d9d9de; --soft: rgba(0, 0, 0, .05) }
    html[data-theme="dark"] { color-scheme: dark; --board-bg: var(--card); --field-line: #3a3a45; --soft: rgba(255, 255, 255, .06) }
    html:not([data-theme="dark"]) { color-scheme: light }

    /* text fields only get the pill look; checkboxes / ranges are drawn separately */
    input[type=checkbox], input[type=radio], input[type=range], input[type=file], input[type=color] { flex: none; letter-spacing: 0; text-transform: none; padding: 0 }
    input[type=range] { flex: 1; min-width: 0; border: 0; background: none; accent-color: var(--red2); height: 28px }
    input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--field-line); background: var(--input-bg); display: inline-grid; place-content: center; cursor: pointer; margin: 0; transition: background .15s, border-color .15s }
    input[type=checkbox]::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) scale(0); margin-top: -2px; transition: transform .12s }
    input[type=checkbox]:checked { background: var(--red2); border-color: var(--red2) }
    input[type=checkbox]:checked::after { transform: rotate(45deg) scale(1) }
    input[type=checkbox]:disabled { opacity: .5 }
    input::placeholder { color: var(--mute); opacity: .8 }
    html[data-theme="dark"] input { background: var(--input-bg); color: var(--ink); border-color: var(--field-line) }
    html[data-theme="dark"] input[type=checkbox]:checked { background: var(--red2); border-color: var(--red2) }
    html[data-theme="dark"] input[type=range] { background: none; border: 0 }
    select { font: inherit; color: var(--ink); background-color: var(--input-bg, #fff); border: 1.5px solid var(--field-line); border-radius: 12px; padding: 10px 34px 10px 12px; -webkit-appearance: none; appearance: none; cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%239a9aa4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; max-width: 100% }
    select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
    select option { background: var(--card); color: var(--ink) }

    /* ---- dark-mode catches: anything that was hard-coded light ---- */
    html[data-theme="dark"] #installBanner,
    html[data-theme="dark"] .rail-lobby { background: var(--card); color: var(--ink) }
    html[data-theme="dark"] .board.rpsboard { background: linear-gradient(145deg, #20202a, #17171e) }
    html[data-theme="dark"] .rps-last.win { background: rgba(31, 143, 78, .18); color: #6fe3a1 }
    html[data-theme="dark"] .rps-last.lose { background: rgba(179, 20, 28, .22); color: #ff9a9f }
    html[data-theme="dark"] .rps-last.tie { background: rgba(247, 197, 43, .14); color: #f1d36a }
    html[data-theme="dark"] .rps button.sel { background: #2a2615; color: #f7c52b }
    html[data-theme="dark"] .rps button { background: var(--card); color: var(--ink); border-color: var(--line) }
    html[data-theme="dark"] .snake-pl { background: var(--soft) }
    html[data-theme="dark"] .snake-pl i { border-color: var(--card) }
    html[data-theme="dark"] .wmeta, html[data-theme="dark"] .wlabel { color: var(--mute) }
    html[data-theme="dark"] .wordscore span, html[data-theme="dark"] .wordlist span { background: var(--soft); color: var(--ink) }
    html[data-theme="dark"] .jsuitpicker button { background: var(--card); color: var(--ink) }
    html[data-theme="dark"] .tier-Gold { color: #f7c52b }
    html[data-theme="dark"] .tier-Silver { color: #c9ced6 }
    html[data-theme="dark"] .empty { color: var(--mute) }
    html[data-theme="dark"] .room, html[data-theme="dark"] .rmitem { background: #23232c }
    html[data-theme="dark"] .rwnote, html[data-theme="dark"] .rwhero { background: var(--card); color: var(--ink); border-color: var(--line) }
    html[data-theme="dark"] .rwhero p { color: var(--mute) }
    html[data-theme="dark"] .rwdone { background: rgba(31, 143, 78, .16); color: #7be2a7 }
    html[data-theme="dark"] .btn.ghost { color: var(--ink) }
    html[data-theme="dark"] .btn.ghost:disabled { opacity: .45 }
    html[data-theme="dark"] .srow { color: var(--ink) }
    html[data-theme="dark"] .tgl { background: #3a3a45 }
    html[data-theme="dark"] .tgl.on { background: var(--red2) }
    html[data-theme="dark"] .grp, html[data-theme="dark"] .swho, html[data-theme="dark"] .lbstrip, html[data-theme="dark"] .rwstrip, html[data-theme="dark"] .qtile, html[data-theme="dark"] .dash, html[data-theme="dark"] .chcard { background: var(--card); color: var(--ink); border-color: var(--line) }
    html[data-theme="dark"] .lobtabs [role=tab]:not(.on) { background: var(--card); color: var(--ink); border-color: var(--line) }
    html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #3a3a45 }
    /* ludo board art stays light (it is the board), but its frame follows the theme */
    html[data-theme="dark"] .lgrid-wrap { box-shadow: 0 6px 20px rgba(0, 0, 0, .55) }

    /* ---- sheets: always above the sticky tab bar, themed, with a handle ---- */
    .sheet-bg { z-index: 70; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px) }
    .sheet { background: var(--card); color: var(--ink); max-height: 90vh; max-height: 90dvh; padding-top: 10px; overscroll-behavior: contain }
    .sheet::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px }
    .gsheet { display: flex; flex-direction: column; gap: 12px }
    .gsheet > * { margin: 0 }
    .gs-head { display: flex; align-items: center; gap: 12px }
    .gs-head h2 { margin: 0; flex: 1; font-size: 22px }
    .gs-ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--soft); color: var(--red2); flex-shrink: 0 }
    html[data-theme="dark"] .gs-ico { color: #ff7b82 }
    .gs-x { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); color: var(--ink); font-size: 22px; line-height: 1; display: grid; place-items: center }
    .gs-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px }
    .gs-actions { display: grid; gap: 10px }
    .gs-actions .btn, .gs-how, .gs-bot { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; text-align: center }
    .gs-card { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 14px }
    html[data-theme="dark"] .gs-card { background: #15151b }
    .gs-hint { display: block; color: var(--mute); font-size: 12.5px; margin: 8px 2px 12px; line-height: 1.4 }
    .seg { display: flex; flex-wrap: wrap; gap: 8px }
    .seg button { flex: 1 1 0; min-width: 64px; padding: 11px 8px; border-radius: 14px; font-weight: 700; font-size: 13.5px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; transition: background .15s, border-color .15s, color .15s }
    .seg button.on, .seg .pcbtn.on { background: var(--red2); color: #fff; border-color: var(--red2); box-shadow: none }
    .seg.lvl button { min-width: 0; padding: 10px 6px; font-size: 12.5px }
    .gs-rules { padding: 6px 14px 4px }
    .gs-rules .gs-label { margin: 8px 0 2px }
    .optrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.35; cursor: pointer }
    .optrow:last-child { border-bottom: 0 }
    .optrow > span { flex: 1; min-width: 0 }
    .optsel { flex: 0 1 46%; min-width: 120px; font-size: 14px }
    .optrow input[type=checkbox] { width: 46px; height: 28px; border-radius: 99px; border: 0; background: var(--field-line); position: relative; display: block; flex: none }
    .optrow input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; margin: 0; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transform: none; transition: transform .18s }
    .optrow input[type=checkbox]:checked { background: var(--red2) }
    .optrow input[type=checkbox]:checked::after { transform: translateX(18px) }
    html[data-theme="dark"] .optrow input[type=checkbox] { background: #3a3a45 }
    html[data-theme="dark"] .optrow input[type=checkbox]:checked { background: var(--red2) }

    /* ---- lobby tabs (four now) ---- */
    .lobtabs { gap: 6px; padding-left: 12px; padding-right: 12px }
    .lobtabs [role=tab] { padding: 11px 4px; font-size: 13px; position: relative; min-width: 0; overflow: hidden; text-overflow: ellipsis }
    .tabbadge { position: absolute; top: 3px; right: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--gold); color: #1a0508; font-size: 10.5px; font-weight: 800; display: inline-grid; place-items: center; line-height: 1 }
    .tabbadge[hidden] { display: none }
    .lobtabs [role=tab].on .tabbadge { background: #fff; color: var(--red2) }

    /* ---- rooms tab ---- */
    .rmwrap { padding: 14px 18px 30px; display: flex; flex-direction: column; gap: 16px }
    .rmcard, .rmbox { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px }
    .rmcard h3, .rmhead h3 { margin: 0; font-size: 16px }

    .rmcode .btn { padding: 12px 24px }
    .rmhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px }
    .rmrefresh { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); color: var(--ink); font-size: 18px; display: grid; place-items: center }
    .rmlist { display: flex; flex-direction: column; gap: 10px }
    .rmitem { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 12px }

    .rmempty { text-align: center; padding: 18px 8px }

    /* ---- tour: back + skip on the left, next on the right ---- */
    #tourLayer .tour-card { max-width: calc(100vw - 24px) }

    #tourLayer .tour-dots i { width: 6px; height: 6px }
    #tourLayer .tour-left { display: flex; align-items: center; gap: 2px }
    #tourLayer .tour-prev { background: var(--soft); color: var(--ink); font-weight: 700; padding: 10px 14px; border-radius: 999px; font-size: 14px }
    #tourLayer .tour-prev:disabled { opacity: .35 }
    #tourLayer .tour-skip { padding: 10px 12px }

    /* ---- settings rows ---- */
    .grp { overflow: hidden }
    .srow { box-sizing: border-box; min-height: 54px; text-align: left }
    .srow .lbl { min-width: 0; line-height: 1.3 }
    .srow-sel { margin-left: auto; max-width: 52%; min-width: 120px; font-size: 14px; padding-top: 8px; padding-bottom: 8px }
    .srow-range { margin-left: auto; width: 46%; flex: none }
    label.srow { cursor: default }

    /* ---- rewards / legal name form ---- */
    .rwform { gap: 14px }
    .rwform label { color: var(--ink) }
    .rwform input[type=text] { width: 100%; text-transform: none; letter-spacing: 0; border: 1.5px solid var(--field-line); border-radius: 14px; background: var(--input-bg); color: var(--ink); font-size: 15px; padding: 13px 14px }
    .rwform select { width: 100%; font-size: 15px; padding: 13px 38px 13px 14px }
    .rwform .chk { flex-direction: row; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; line-height: 1.4; font-weight: 500; font-size: 13.5px; cursor: pointer }
    .rwform .chk input { margin-top: 1px }
    .rwform .btn { width: 100%; margin-top: 4px; min-height: 50px }

    /* ---- multiplayer boards ---- */
    .rps-multi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px }
    .rps-multi .rps-player { width: auto }
    .cf .cell.pc2 { background: #2ea15a }
    .cf .cell.pc3 { background: #8e5bd6 }
    .cf[style*="repeat(9"], .cf[style*="repeat(10"] { gap: 3px; padding: 6px }

    /* ---- GAME HUB watermark, same wordmark as the ludo board centre ---- */
    .play::after { content: "GAME HUB"; position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 5; pointer-events: none; padding: 7px 12px 7px 30px; border-radius: 999px; font-weight: 800; font-size: 11px; letter-spacing: .14em; color: rgba(255, 255, 255, .88); background: rgba(0, 0, 0, .28) conic-gradient(#c0272d 0 25%, #1f8f4e 0 50%, #1f57b5 0 75%, #d8a913 0) no-repeat 9px 50% / 14px 14px; text-shadow: 0 1px 2px rgba(0, 0, 0, .45); opacity: .85 }

    /* ---- follow-up polish ---- */
    .lobtabs [role=tab] { overflow: visible }
    .tabbadge { top: -5px; right: 2px }
    html[data-theme="dark"] .logoutbtn { color: #ff7b82; background: rgba(255, 90, 100, .12) }
    .seg.lvl button { font-size: 12px; padding: 10px 2px; white-space: nowrap }
    .rwview > div:first-child { gap: 10px }
    .rwview h1 { flex: 1; margin: 0; font-size: 22px; text-align: center }

    html[data-theme="dark"] .rps-player strong { color: #ff9a9f }
    html[data-theme="dark"] .rps-player b { color: var(--ink) }
    html[data-theme="dark"] .rps-player { background: #1a1a22 }
    html[data-theme="dark"] .rps-player.you { background: #3a3220; border-color: #f7c52b }
    .rps-multi { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)) }
  </style>
</head>

    function animateLudoMove(ev) {
      const { player, token, from, to } = ev;

      const hEl = document.querySelector(`[data-hscore="${player}"]`);
      if (hEl) hEl.classList.remove('counting', 'low'); // briefly show the score climbing instead of the countdown
      const seq = from === 0 ? [to] : Array.from({ length: Math.max(1, to - from) }, (_, k) => from + 1 + k);
      const stepDur = Math.max(90, Math.min(180, 600 / seq.length));
      animUntil = Math.max(animUntil, Date.now() + seq.length * stepDur + 120);
      SFX.move();

        if (el) {
          const { left, top } = ltokCoord(color, start, seq[i], token);
          el.style.left = left;

        i++;

    function resizeImage(file, maxSide = 480, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > height && width > maxSide) { height = height / width * maxSide;
            width = maxSide; }
          else if (height > maxSide) { width = width / height * maxSide;
            height = maxSide; }
          const c = document.createElement('canvas');
          c.width = width;
          c.height = height;
          c.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

      const scoreHtml = pc <= 2
        ? `<div class="rps-score"><div class="rps-player you ${locked?'waiting':''}"><b>${playerName(mine)}</b><strong>${st.scores?.[mine] || 0}</strong></div><span class="rps-vs">VS</span><div class="rps-player ${st.opponentPicked?'waiting':''}"><b>${playerName(opponent)}</b><strong>${st.scores?.[opponent] || 0}</strong></div></div>`
        : `<div class="rps-multi">${Array.from({ length: pc }, (_, i) => `<div class="rps-player ${i === mine ? 'you' : ''} ${st.pickedFlags?.[i] ? 'waiting' : ''}"><b>${playerName(i)}</b><strong>${st.scores?.[i] || 0}</strong></div>`).join('')}</div>`;
      return `<div class="board rpsboard">
        ${scoreHtml}
        <div class="rps-round">Round ${st.round || 1} · First to ${st.target || 3} wins${(st.gestures || []).length > 3 ? ' · Rock Paper Scissors Lizard Spock' : ''}</div>
        <div class="rps-prompt" aria-live="polite">${esc(prompt)}</div>
        <div class="rps">${buttons}</div>
        <button id="rpsSubmit" class="rps-submit" ${!selected || locked || result ? 'disabled' : ''}>Lock in choice</button>
        ${lastHtml}

    }
    const JOKER_SUITS = { hearts:'♥', diamonds:'♦', clubs:'♣', spades:'♠' };
    const JOKER_NUMBER_RANKS = new Set(['2','3','4','5','6','7','8','9','10']);
    const JOKER_SUIT_LABELS = { hearts:'Hearts', diamonds:'Diamonds', clubs:'Clubs', spades:'Spades' };
    let jokerPendingIndex = null;
    function jokerCardHtml(card, { index = null, big = false, playable = false } = {}) {
      if (!card) return '';
      const red = card.suit === 'hearts' || card.suit === 'diamonds';
      const wild = !!card.joker;
      return `<button class="jcard ${red?'red ':''}${wild?'jwild ':''}${big?'big ':''}${playable?'playable':''}" ${index != null ? `data-ji="${index}"` : ''} ${index != null && !playable ? 'disabled' : ''} aria-label="${wild?'Joker':`${card.rank} of ${card.suit}`}" style="${index == null ? 'cursor:default' : ''}">${wild ? '<span class="jwildmark">JOKER</span>' : `<span class="jr">${card.rank}</span><span class="jsuit">${JOKER_SUITS[card.suit]}</span><span class="jr bottom">${card.rank}</span>`}</button>`;
    }
    function jokerBoardHtml(st, myTurn, players = [], mine = -1) {
      const canAct = myTurn && !result;
      const hand = st.hand || [];
      const canPlay = c => st.pendingPick > 0 ? JOKER_NUMBER_RANKS.has(c.rank) : (c.joker || !st.topCard ? true : st.calledSuit ? c.suit === st.calledSuit : c.suit === st.topCard.suit || c.rank === st.topCard.rank);
      const handHtml = hand.map((c,i) => jokerCardHtml(c, { index:i, playable:canAct && canPlay(c) })).join('');
      const opponents = (st.handCounts || []).map((count,i) => i).filter(i => i !== mine).map(i => `<div class="jopp ${st.turn===i?'turn':''} ${st.active?.[i]===false?'out':''}"><span>${nameOf(players[i])}</span><strong>${st.handCounts[i]}</strong></div>`).join('');
      const picker = jokerPendingIndex != null ? `<div class="jsuitpicker"><b>Choose the next suit:</b>${Object.keys(JOKER_SUITS).map(s => `<button class="${s==='hearts'||s==='diamonds'?'red':''}" data-jsuit="${s}">${JOKER_SUITS[s]} ${JOKER_SUIT_LABELS[s]}</button>`).join('')}</div>` : '';
      const status = st.pendingPick > 0 ? `Penalty stack: ${st.pendingPick} — play a numbered card to add to it` : st.calledSuit ? `Wild suit: ${JOKER_SUIT_LABELS[st.calledSuit]}` : canAct ? 'Your turn — match the rank or suit' : `${nameOf(players[st.turn])}’s turn`;
      const marketDisabled = !canAct || hand.some(canPlay);
      return `<div class="board joker"><div class="jopps">${opponents}</div><div class="jstatus" aria-live="polite">${esc(status)}</div>${st.pendingPick ? '<div class="jpenalty">Number cards 2–10 can continue this stack.</div>' : ''}<div class="jtable"><div><button class="jmarket" data-jmarket="1" ${marketDisabled?'disabled':''}>DRAW</button><div class="jcaption">${st.pendingPick ? `Draw ${st.pendingPick}` : `Market ${st.marketCount ?? ''}`}</div></div><div>${jokerCardHtml(st.topCard,{big:true})}<div class="jcaption">Top card</div></div></div>${picker}<div class="jhand">${handHtml || '<span>No cards</span>'}</div></div>`;
    }
    function board(g, myTurn, players, mine, maxPlayers) {
      const b = gstate?.board || [];
      if (g === 'tictactoe') {
        const n = gstate?.size || TTT_SIZE_BY_PLAYERS[maxPlayers] || Math.round(Math.sqrt(b.length)) || 3;
        const win = new Set(gstate?.winLine || []);
        return `<div class="board ttt ttt-${n}" style="grid-template-columns:repeat(${n},1fr)">${b.flat().map((v,i)=>`<button class="cell p${v ?? ''}${win.has(i)?' win':''}" data-i="${i}" aria-label="${v==null?'Empty':esc(sym(v))} cell ${i+1}" ${result||!myTurn||sym(v)?'disabled':''}>${esc(sym(v))}</button>`).join('')}</div>`;
      }
      if (g === 'connectfour') {
        const rows = b.length,
          cols = b[0]?.length || 7;
        return `<div class="board cf" style="grid-template-columns:repeat(${cols},1fr)">${b.flat().map((v,i)=>`<button class="cell ${v == null ? '' : (v % 2 ? 'b' : 'a') + ' pc' + v}" data-c="${i%cols}" ${result||!myTurn?'disabled':''} aria-label="Column ${i%cols+1}"></button>`).join('')}</div>`;
      }
      if (g === 'rps') return rpsBoardHtml(gstate || {}, mine, players);
      if (g === 'joker') return jokerBoardHtml(gstate || {}, myTurn, players, mine);
      if (g === 'ludo') {
        const st = gstate || {};
        if (!st.starts) return ludoBoardHtml({ colors: [], tokens: [], starts: [] }, mine, null, players);
        const canMove = result ? null : !myTurn ? null : st.dice == null ? 'roll' : 'move';
        return ludoBoardHtml(st, mine, canMove, players);
      }
      if (g === 'chess') return chessBoardHtml(gstate || {}, myTurn, mine, players);
      if (g === 'whot') return whotBoardHtml(gstate || {}, myTurn, players, mine);
      if (['checkers','mancala','battleship','snakes','dominoes','words'].includes(g)) return newGameBoardHtml(g, gstate || {}, myTurn, mine, players);
      return '';
    }
    

    /* ---------- word clash: letter rack ---------- */
    const WORD_VALUES = { A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10 };
    const wordVal = (st, ch) => (st?.values || WORD_VALUES)[ch] ?? 0;
    const wordPts = (st, w) => { let t = 0; for (const ch of w) t += wordVal(st, ch); return t + (w.length >= 4 ? (w.length - 3) ** 2 : 0); };
    let wordDraft = [], wordOrder = [], wordRackKey = '', wordKeysBound = false;
    function wordSync(hand) {
      const key = hand.join('');
      if (key !== wordRackKey) { wordRackKey = key; wordDraft = []; wordOrder = hand.map((_, i) => i); }
      if (wordOrder.length !== hand.length) wordOrder = hand.map((_, i) => i);
    }
    const wordTile = (st, ch, extra = '') => `${esc(ch)}<i class="wv">${ch === '?' ? '' : wordVal(st, ch)}</i>`;
    function wordRackInner(st, hand, canPlay) {
      return wordOrder.map(i => `<button type="button" class="wtile ${wordDraft.includes(i)?'used':''}" data-wt="${i}" aria-label="Letter ${esc(hand[i])}" ${canPlay?'':'disabled'}>${wordTile(st, hand[i])}</button>`).join('');
    }
    function wordSlotsInner(st, hand, canPlay) {
      const n = Math.max(hand.length, 7);
      return Array.from({ length: n }, (_, k) => k < wordDraft.length
        ? `<button type="button" class="wtile slot" data-ws="${k}" aria-label="Remove ${esc(hand[wordDraft[k]])}" ${canPlay?'':'disabled'}>${wordTile(st, hand[wordDraft[k]])}</button>`
        : `<span class="wtile empty"></span>`).join('');
    }
    function wordsBoardHtml(st, myTurn, players, mine, ro) {
      const seat = mine >= 0 ? mine : 0;
      const hand = st.hands?.[seat] || [];
      if (!ro) wordSync(hand); else { wordDraft = []; wordOrder = hand.map((_, i) => i); }
      const can = !ro && myTurn;
      const words = (st.words || []).slice(-8);
      const score = (st.scores || []).map((x, i) => `<span class="${i===mine?'me':''}">${nameOf(players[i])}: <b>${x}</b></span>`).join('');
      const list = words.map((w, i) => `<span class="${i===words.length-1?'last':''}">${esc(w.word)}${w.pts ? ` +${w.pts}` : ''}</span>`).join('');
      const PREM = { DL: 'Double letter', TL: 'Triple letter', DW: 'Double word', TW: 'Triple word' };
      const premTxt = p => p && p.type !== 'none' ? `${PREM[p.type]}${p.letter ? ' (' + esc(p.letter) + ')' : ''}` : 'No bonus';
      const premium = st.premium ? `<div class="wmeta" role="status" style="font-weight:700">⭐ This turn: ${premTxt(st.premium)} <span style="font-weight:400;opacity:.7">· Next: ${premTxt(st.nextPremium)}</span></div>` : '';
      const meta = `<div class="wmeta">Tiles in bag: ${st.bagCount ?? '–'} · Words played ${st.plays || 0}/${st.maxPlays || 24}</div>${premium}`;
      if (ro) return `<div class="board words ro"><div class="wordscore">${score}</div><div class="wordlist">${list}</div><div class="wlabel">Letter rack</div><div class="wrackwrap"><div class="wrack">${hand.map(c => `<span class="wtile">${wordTile(st, c)}</span>`).join('')}</div></div></div>`;
      return `<div class="board words"><div class="wordscore">${score}</div>${meta}
        <div class="wlabel">Your word</div><div class="wslots" id="wordSlots">${wordSlotsInner(st, hand, can)}</div>
        <div class="wlabel">Your letter rack${can ? '' : ' · wait for your turn'}</div>
        <div class="wrackwrap"><div class="wrack" id="wordRack">${wordRackInner(st, hand, can)}</div></div>
        <div class="wactions"><button class="btn ghost" id="wordShuf" type="button" ${can?'':'disabled'} aria-label="Shuffle rack">⇄</button><button class="btn ghost" id="wordBack" type="button" ${can?'':'disabled'} aria-label="Delete last letter">⌫</button><button class="btn ghost" id="wordSwap" type="button" ${can?'':'disabled'} aria-label="${(st.bagCount||0) > 0 ? 'Swap whole rack and skip turn' : 'Pass turn'}" title="${(st.bagCount||0) > 0 ? 'Swap rack (skips your turn)' : 'Pass (no tiles left to draw)'}">${(st.bagCount||0) > 0 ? '⟳ Swap' : 'Pass'}</button><button class="btn wplay" id="wordPlay" type="button" disabled>Play word</button><span class="wpts" id="wordPts"></span></div>
        <div class="wlabel">Words played</div><div class="wordlist">${list || '<em>none yet</em>'}</div></div>`;
    }
    function bindWords(myTurn, act) {
      const rack = $('#wordRack'); if (!rack) return;
      const mineIdx = room.you ?? 0;
      const st = gstate || {};
      const hand = st.hands?.[mineIdx] || [];
      const refresh = () => {
        const can = myTurn && !result;
        rack.innerHTML = wordRackInner(st, hand, can);
        $('#wordSlots').innerHTML = wordSlotsInner(st, hand, can);
        const play = $('#wordPlay'); if (play) play.disabled = !can || wordDraft.length < 2;
        const pts = $('#wordPts'); if (pts) pts.textContent = wordDraft.length >= 2 ? `+${wordPts(st, wordDraft.map(i => hand[i]).join(''))}` : '';
        rack.querySelectorAll('[data-wt]').forEach(b => b.onclick = () => add(+b.dataset.wt));
        $('#wordSlots').querySelectorAll('[data-ws]').forEach(b => b.onclick = () => { wordDraft.splice(+b.dataset.ws, 1); SFX.move?.(); refresh(); });
      };
      const add = i => { if (!myTurn || result || wordDraft.includes(i) || wordDraft.length >= hand.length) return; wordDraft.push(i); SFX.move?.(); vibrate(8); refresh(); };
      wordBind = { add, refresh, hand, myTurn };
      $('#wordBack')?.addEventListener('click', () => { wordDraft.pop(); refresh(); });
      $('#wordShuf')?.addEventListener('click', () => { for (let k = wordOrder.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [wordOrder[k], wordOrder[j]] = [wordOrder[j], wordOrder[k]]; } refresh(); });
      $('#wordSwap')?.addEventListener('click', () => { const b = $('#wordSwap'); if (!b.dataset.armed) { b.dataset.armed = '1'; const lbl = b.textContent; b.textContent = 'Tap to confirm'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = lbl; } }, 3000); return; } wordDraft = []; act((st.bagCount || 0) > 0 ? { swap: true } : { pass: true }); });
      $('#wordPlay')?.addEventListener('click', () => {
        const w = wordDraft.map(i => hand[i]).join(''); if (w.length < 2) return;
        wordDraft = []; act(MOVE.words(w)); refresh();
      });
      refresh();
      if (!wordKeysBound) {
        wordKeysBound = true;
        document.addEventListener('keydown', e => {
          if (!wordBind || !$('#wordRack') || e.ctrlKey || e.metaKey || e.altKey) return;
          if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
          const { add, refresh, hand, myTurn } = wordBind; if (!myTurn) return;
          if (e.key === 'Backspace') { wordDraft.pop(); refresh(); e.preventDefault(); }
          else if (e.key === 'Enter') { $('#wordPlay')?.click(); }
          else if (/^[a-z]$/i.test(e.key)) { const L = e.key.toUpperCase(); const i = wordOrder.find(k => hand[k] === L && !wordDraft.includes(k)); if (i != null) add(i); }
        });
      }
    }
    let wordBind = null;

    /* ---------- whot ---------- */
    const WHOT_SVG = {
      circle: '<circle cx="50" cy="50" r="40"/>',
      triangle: '<polygon points="50,8 94,88 6,88"/>',
      cross: '<path d="M36 6h28v30h30v28H64v30H36V64H6V36h30z"/>',
      square: '<rect x="12" y="12" width="76" height="76" rx="4"/>',
      star: '<polygon points="50,4 62,37 97,38 69,59 79,93 50,73 21,93 31,59 3,38 38,37"/>'
    };
    const whotShapeSvg = (shape, cls = 'wc-shape') => WHOT_SVG[shape] ? `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">${WHOT_SVG[shape]}</svg>` : '';
    function whotCardHtml(card, { index, disabled, big, playable } = {}) {
      const label = String(card.value);
      const centre = card.shape === 'whot' ? '<span class="wc-wild">WHOT</span>' : whotShapeSvg(card.shape);
      return `<button class="wcard s-${card.shape}${big?' big':''}${playable?' playable':''}" ${index!=null?`data-wi="${index}"`:''}
    ${disabled?'disabled':''} aria-label="${card.shape} ${card.value}"><span class="wc-idx tl">${label}</span>${centre}<span class="wc-idx br">${label}</span></button>`;
    }
    
    const whotBackHtml = (style = '') => `<span class="wback" style="${style}"><span class="wlabel">WHOT</span></span>`;
    
    function whotOppsHtml(st, players, mine) {
      const counts = st.handCounts || [];
      const opps = counts.map((c, i) => i).filter(i => i !== mine);
      if (!opps.length) return '';
      return `<div class="wopps">${opps.map(i => {
        const n = counts[i], shown = Math.min(n, 3), more = Math.max(0, n - shown), mid = (shown - 1) / 2;
        const fan = Array.from({ length: shown }, (_, k) => whotBackHtml(`transform:rotate(${((k - mid) * 7).toFixed(1)}deg)`)).join('');
        const out = st.active && st.active[i] === false;
        return `<div class="wopp${st.turn === i ? ' turn' : ''}"><div class="wopp-name">${esc(nameOf(players[i]))}<small>${out ? 'out' : n + (n === 1 ? ' card' : ' cards')}</small></div>
        <div class="wfan">${fan}${more ? `<span class="wfan-more">+${more}</span>` : ''}</div></div>`;
      }).join('')}</div>`;
    }
    
    function whotCardMatches(card, st) {
      if (card.shape === 'whot') return true;
      if (st.calledShape) return card.shape === st.calledShape;
      return !!st.topCard && (card.shape === st.topCard.shape || card.value === st.topCard.value);
    }
    
    function whotHasPlayable(st) {
      const hand = st.hand || [];
      if (st.pendingPick > 0) { const nv = st.pendingType === 'two' ? 2 : 3; return hand.some(c => c.value === nv); }
      return hand.some(c => whotCardMatches(c, st));
    }
    
    function whotBoardHtml(st, myTurn, players = [], mine = -1) {
      if (!st.topCard) return `<div class="board whot"></div>`;
      const canAct = myTurn && !result;
      const marketDisabled = !canAct || (st.pendingPick > 0 && whotHasPlayable(st));
      const hand = st.hand || [];
      const pendingVal = st.pendingType === 'two' ? 2 : 3;
      const handHtml = hand.map((c, i) => {
        const playable = canAct && (st.pendingPick > 0 ? c.value === pendingVal : whotCardMatches(c, st));
        return whotCardHtml(c, { index: i, disabled: !playable, big: false, playable });
      }).join('');
      const pickerHtml = whotPendingIndex != null ? `<div class="wpick">
      ${SHAPES_WHOT.map(s => `<button data-wshape="${s}">${whotShapeSvg(s, '')} ${s}</button>`).join('')}
      <button data-wcancel="1" style="background:none;color:#f4ecd2">Cancel</button>
    </div>` : '';
      return `<div class="board whot">
    ${whotOppsHtml(st, players, mine)}
    <div class="wtable">
      <div class="wpile"><button class="wmarket" data-wmarket="1" ${marketDisabled?'disabled':''} aria-label="Draw from market"><span class="wlabel">WHOT</span></button>
        <span class="wpile-cap">Market ${st.marketCount ?? ''}</span></div>
      <div class="wpile">${whotCardHtml(st.topCard, { big:true })}<span class="wpile-cap">${st.calledShape ? 'Calling: ' + st.calledShape : 'Top card'}</span></div>
    </div>
    ${pickerHtml}
    <div class="whand">${handHtml}</div>
  </div>`;
    }
    const SHAPES_WHOT = ['circle', 'triangle', 'cross', 'square', 'star'];
    
    const CHESS_GLYPHS = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
    const CHESS_NAMES = { p:'pawn', n:'knight', b:'bishop', r:'rook', q:'queen', k:'king' };
    let chessSelected = null;
    function chessBoardHtml(st, myTurn, mine, players = []) {
      const board = st.board || [], size = st.size || 14, selected = chessSelected != null ? chessSelected : -1;
      const targets = new Set((st.legal || []).filter(m => m.from === selected).map(m => m.to));
      const orient = size === 8 ? (mine === 1 ? 2 : 0) : (mine >= 0 ? mine : 0);
      const sideMap = size === 8 ? (orient === 2 ? ['top','bottom'] : ['bottom','top']) : (orient === 0 ? ['bottom','left','top','right'] : orient === 1 ? ['right','bottom','left','top'] : orient === 2 ? ['top','right','bottom','left'] : ['left','top','right','bottom']);
      const chessSeats = players.map((p, i) => p ? `<div class="chess-seat ${sideMap[i] || 'top'} ${i === mine ? 'you' : ''}"><img src="${avatar(p)}" alt=""><span>${nameOf(p)}${i === mine ? ' (you)' : ''}</span></div>` : '').join('');
      const isPlayable = (r,c) => size === 8 || (r >= 3 && r <= 10) || (c >= 3 && c <= 10);
      const squares = Array.from({ length: size * size }, (_, view) => {
        const vr = Math.floor(view / size), vc = view % size;
        // Standard chess: player 0 is at the bottom; rotate 180° for player 1.
        // Cross chess: rotate the board so the local player's side is always bottom.
        let r = vr, c = vc;
        if (orient === 1) { r = vc; c = size - 1 - vr; }
        else if (orient === 2) { r = size - 1 - vr; c = size - 1 - vc; }
        else if (orient === 3) { r = size - 1 - vc; c = vr; }
        const i = r * size + c, p = board[i];
        if (!isPlayable(r,c)) return '<span class="square void" aria-hidden="true"></span>';
        const target = targets.has(i), capture = target && p, check = st.check === i;
        return `<button class="square ${(vr+vc)%2?'dark':'light'} ${selected===i?'selected':''} ${target?'target':''} ${capture?'capture':''} ${check?'check':''}" data-chess="${i}" aria-label="${p ? CHESS_NAMES[p.type] : 'empty'} ${String.fromCharCode(97+c)}${r+1}">${p ? `<span class="piece p${p.player}">${CHESS_GLYPHS[p.type]}</span>` : ''}</button>`;
      }).join('');
      const coords = Array.from({length:size}, (_, i) => `<span>${String.fromCharCode(97 + i)}</span>`).join('');
      return `<div class="chess-wrap">${chessSeats}<div class="board chess" style="grid-template-columns:repeat(${size},1fr)">${squares}</div><div class="chess-coords">${coords}</div></div>`;
    }
    function newGameBoardHtml(g, st, myTurn, mine, players) {
      if (g === 'checkers') { const b=st.board||[]; const can=new Set(myTurn?(st.legal||[]).map(m=>m.from):[]); const hint=myTurn&&st.mustCapture?`<p class="rwnote" style="text-align:center;margin:0 0 8px">Capture is compulsory${st.mustContinue!=null?' - keep jumping with the same piece':''}.</p>`:''; return `<div class="board checkers">${hint}<div class="ckgrid">${b.flat().map((v,i)=>`<button class="ckcell ${(Math.floor(i/8)+i)%2?'dark':'light'} ${v?'p'+v.player:''} ${can.has(i)?'can':''}" data-ck="${i}" ${!myTurn?'disabled':''} ${can.has(i)?'aria-label="Piece that can move"':''}>${v?(v.king?'♛':'●'):''}</button>`).join('')}</div></div>`; }
      if (g === 'mancala') return `<div class="board mancala"><div class="mboard"><div class="mstore">${st.stores?.[1]||0}</div><div class="mpits">${(st.pits?.[1]||[]).slice().reverse().map((n,j)=>`<button data-mpit="${5-j}" ${!myTurn?'disabled':''}>${n}</button>`).join('')}${(st.pits?.[0]||[]).map((n,j)=>`<button data-mpit="${j}" ${!myTurn?'disabled':''}>${n}</button>`).join('')}</div><div class="mstore">${st.stores?.[0]||0}</div></div></div>`;
      if (g === 'battleship') {
        const ls = st.lastShot, mineShot = ls && ls.by === mine;

          live.style.zIndex = 30; live.style.left = t.style.left; live.style.top = t.style.top;

        <div class="hl-card" id="hlCard"></div>
        <div class="hl-lower" id="hlLower"></div>
        <div class="hl-prog" id="hlProg">${highlights.map(() => '<i><b></b></i>').join('')}</div>
        <div class="hl-btns">${ctx.matchId ? '<button class="hl-share" id="hlShare" type="button">SHARE ↗</button>' : ''}<button class="hl-skip" id="hlSkip" type="button">SKIP ›</button></div>
        <div class="hl-flash" id="hlFlash"></div>`;
      document.body.appendChild(el);
      const $e = id => el.querySelector('#' + id), stage = el.querySelector('.hl-stage');
      const snap = st => boardSnapshot(game, st, players, mine, maxPlayers);
      const prog = [...el.querySelectorAll('#hlProg i')];
      const t0 = Date.now();
      const clock = setInterval(() => { if (!el.isConnected) return clearInterval(clock); const s = Math.floor((Date.now()-t0)/1000); const tc = $e('hlTc'); if (tc) tc.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }, 500);
      const finish = () => { clearInterval(clock); closeHighlightCinema(); };
      $e('hlSkip').onclick = finish;
      $e('hlShare')?.addEventListener('click', () => shareHighlight(ctx, wName));
      const card = (small, big, sub) => { const c = $e('hlCard'); c.innerHTML = `<small>${esc(small)}</small><h1>${esc(big)}</h1><p>${esc(sub||'')}</p>`; c.classList.add('show'); };
      const flash = () => { const f = $e('hlFlash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); };
      const outro = () => {
        $e('hlBoard').style.visibility = 'hidden'; $e('hlLower').innerHTML = ''; stage.querySelectorAll('.hl-wordtiles').forEach(x => x.remove()); flash();
        card(won ? 'GAME OVER' : 'MATCH COMPLETE', won ? 'VICTORY' : 'DEFEAT', won ? 'You took the win' : `${wName} took the win`);
        $e('hlSkip').textContent = 'CLOSE ✕';
        won ? SFX.win?.() : SFX.lose?.();
        won ? sayEv('win', {}, 2) : sayEv('hlOutro', { name: wName }, 2);
        hlLater(finish, OUTRO);
      };
      const clip = i => {
        if (!el.isConnected) return;
        if (i >= highlights.length) return outro();
        const item = highlights[i], last = i === highlights.length - 1, tag = hlTag(game, item, last);
        $e('hlCard').classList.remove('show'); stage.querySelectorAll('.hl-wordtiles').forEach(x => x.remove());
        const b = $e('hlBoard'); b.style.visibility = 'visible';
        const animate = !!item.prev && !reduce;
        b.innerHTML = snap(animate ? item.prev : item.state);   // start from the position BEFORE the move
        if (game === 'snakes' && window.GHSnakes) { const host = b.querySelector('#snakeStage'); if (host) { try { window.GHSnakes.mount(host, animate ? item.prev : item.state, { code: 'hl-' + (ctxMatch || 'x') }); } catch (e) {} } }
        b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
        flash(); vibrate?.(20);
        const low = $e('hlLower');
        low.classList.remove('go'); void low.offsetWidth;
        low.innerHTML = `<div class="hl-tag ${tag.fin?'fin':''}">${esc(tag.t)}</div><div class="hl-name">${esc(wName)}</div><div class="hl-sub"><span>${esc(formatHighlight(game, item))}</span><span class="hl-pts">+${(item.score||1)*100}</span><span>CLIP ${i+1}/${highlights.length}</span></div>`;
        low.classList.add('go');
        prog.forEach((p, n) => { p.classList.toggle('done', n < i); p.classList.remove('cur'); });
        prog[i].style.setProperty('--d', CLIP + 'ms'); void prog[i].offsetWidth; prog[i].classList.add('cur');
        if (animate) hlLater(() => { if (el.isConnected) { SFX.move?.(); hlMoveAnim(game, item, b, snap, stage); } }, PRE);
        hlLater(() => { if (!el.isConnected) return; const hv = hlVoiceEvent(game, item, tag); sayEv(hv.ev, hv.data, 2); }, PRE + 150);
        hlLater(() => clip(i + 1), CLIP);
      };
      // intro title card, then the reel
      $e('hlBoard').style.visibility = 'hidden';
      card('PLAY OF THE MATCH', wName, gname);
      SFX.win?.(); sayEv('hlIntro', { name: wName, game: gname }, 2);
      hlLater(() => clip(0), INTRO);
    }

    function overCard(mine) {
      const w = result.winnerIndex ?? result.winner;
      const draw = w == null || result.status === 'draw';
      const won = !draw && mine != null && w === mine;
      if (mine == null || mine < 0) {
        const hl = (!draw && (result.highlights || []).length && prefs.winnerReplay) ? `<button class="btn hl-watch" id="watchHl" type="button">▶ Watch highlights</button>` : '';
        return `<div class="over-bg"><div class="over"><h2>Match complete</h2><p>${draw ? 'It ended in a draw.' : `${nameOf(room.players?.[w])} won.`}</p>${hl}<button class="btn ghost" id="again">Lobby</button></div></div>`;
      }
      const maxPlayers = room.maxPlayers || room.players.length || 2;
      const canRe = room.players.length === maxPlayers && room.players.every(p => p.connected) && !room.rematch?.includes(mine);
      const highlights = result.highlights || [];
      const replay = (!draw && highlights.length && prefs.winnerReplay) ? `<button class="btn hl-watch" id="watchHl" type="button">▶ Watch highlights</button>` : '';
      return `<div class="over-bg"><div class="over"><h2>${draw ? 'It’s a draw' : won ? `You won! ${icon('trophy',24)}` : 'You lost'}</h2>
    <p style="margin:0 0 14px;color:#6b6b76">${result.reason === 'forfeit' ? (won ? 'Someone left the match.' : 'You left or timed out.') : stakeLine(result, won, draw)}</p>
    <div>${replay}</div>
    <button class="btn" id="rm" style="margin-right:8px" ${canRe ? '' : 'disabled'}>${room.rematch?.includes(mine) ? 'Waiting…' : 'Rematch'}</button>
    <button class="btn ghost" id="again">Lobby</button></div></div>`;
    }
    
    boot();
    initInstallPrompt();
    
    /* ---------- install as app (PWA) ---------- */
    function initInstallPrompt() {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (isStandalone) return;
      if (sessionStorage.getItem('installDismissed')) return;
      
      const banner = document.createElement('div');
      banner.id = 'installBanner';
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      banner.innerHTML = `<img src="/icon-192.png" alt="">
    <div class="txt"><b>Install GameHub</b><span>${isIOS ? 'Tap Share, then “Add to Home Screen”' : 'Add it to your home screen for quick access'}</span></div>
    ${isIOS ? '' : '<button class="btn" id="installGo">Download</button>'}
    <button class="x" id="installX" aria-label="Dismiss">×</button>`;
      document.body.appendChild(banner);
      $('#installX').onclick = () => { banner.style.display = 'none';
        sessionStorage.setItem('installDismissed', '1'); };
      
      let deferred = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferred = e;
        banner.style.display = 'flex';
      });
      if (isIOS) banner.style.display = 'flex'; // no beforeinstallprompt on iOS Safari — show manual instructions instead
      $('#installGo')?.addEventListener('click', async () => {
        if (!deferred) return;
        deferred.prompt();
        const { outcome } = await deferred.userChoice;
        if (outcome === 'accepted') toast('Installing…');
        banner.style.display = 'none';
        deferred = null;
      });
      window.addEventListener('appinstalled', () => { banner.style.display = 'none';
        toast('GameHub installed'); });
    }
  </script>
</body>

</html>
