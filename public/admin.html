<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub Admin</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#20232a;background:#f4f5f8;--red:#b5222c;--line:#e1e3ea;--muted:#697080}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#20232a;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:900;padding:0 12px 22px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#cbd0da;text-align:left;border-radius:10px;padding:12px;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{background:#3a3f49;color:#fff}.logout{margin:30px 12px 0;width:calc(100% - 24px)}.main{max-width:1100px;width:100%;padding:28px clamp(16px,4vw,42px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 18px #20232a0d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.stat{padding:18px;border-radius:15px;background:#fff;border:1px solid var(--line)}.stat b{display:block;font-size:28px;margin-top:6px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eef0f5;color:#252936}.btn.danger{background:#8c1821}.btn:disabled{opacity:.5}.input,textarea{width:100%;border:1px solid #d8dbe4;border-radius:10px;padding:11px 12px;font:inherit;margin:6px 0 12px;background:#fff}textarea{min-height:150px;resize:vertical}.game{display:grid;grid-template-columns:1fr 1.3fr;gap:22px}.gamehead,.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.switch{display:flex;align-items:center;gap:7px;font-size:13px}.counts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}.counts label{padding:9px 11px;border:1px solid var(--line);border-radius:9px}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline .input{width:auto;flex:1;margin:0}.user{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;border-top:1px solid #eceef3;padding:15px 0}.user-actions{display:flex;gap:7px;flex-wrap:wrap}.user-actions .input{width:110px;margin:0}.user-actions .reason{width:190px}.pill{font-size:11px;background:#fff0d7;color:#875a00;border-radius:999px;padding:4px 8px}.login{max-width:420px;margin:12vh auto}.error{color:var(--red);font-size:13px;margin:8px 0}.hidden{display:none}@media(max-width:760px){.shell{display:block}.side{height:auto;position:sticky;top:0;z-index:3;padding:12px}.brand{padding:5px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px}.logout{position:absolute;right:10px;top:10px;width:auto;margin:0;padding:8px 10px}.main{padding:18px 12px}.grid,.game{grid-template-columns:1fr}.card{padding:16px;border-radius:14px}.top{align-items:flex-start}.top .btn{white-space:nowrap}.user{grid-template-columns:1fr}.user-actions{display:grid;grid-template-columns:1fr 1fr}.user-actions .input,.user-actions .reason{width:100%}.user-actions .btn{grid-column:1/-1}}
</style></head><body><div id="root"></div><script>
const root=document.getElementById('root'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}
function login(){root.innerHTML='<section class="card login"><h1>GameHub Admin</h1><p class="muted">Restricted administration area</p><form id="login"><label>Admin phone<input class="input" id="phone" required></label><label>PIN<input class="input" id="pin" type="password" required></label><div id="err" class="error"></div><button class="btn">Sign in</button></form></section>';login.onsubmit=async e=>{e.preventDefault();try{await api('/admin-api/login',{method:'POST',body:JSON.stringify({phone:phone.value,pin:pin.value})});location.hash='overview';dashboard()}catch(x){err.textContent=x.message}}}
let games=[],users=[];function layout(page){root.innerHTML=`<div class="shell"><aside class="side"><div class="brand">GameHub Admin</div><nav class="nav"><button data-page="overview">Overview</button><button data-page="games">Games & Rules</button><button data-page="users">Users & Penalties</button></nav><button class="btn danger logout" id="logout">Log out</button></aside><main class="main" id="content"></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.page;show(b.dataset.page)});logout.onclick=async()=>{await api('/admin-api/logout',{method:'POST'});login()};show(page||'overview')}
function show(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='games')gamesPage();else if(page==='users')usersPage();else overviewPage()}
function head(title,sub,action=''){return `<div class="top"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function overviewPage(){content.innerHTML=head('Overview','Manage GameHub from separate responsive sections.')+`<div class="grid"><div class="stat"><span class="muted">Configured games</span><b>${games.length}</b></div><div class="stat"><span class="muted">Enabled games</span><b>${games.filter(g=>g.available).length}</b></div><div class="stat"><span class="muted">Users loaded</span><b>${users.length}</b></div><div class="stat"><span class="muted">Admin controls</span><b>Ready</b></div></div><section class="card"><h2>Quick actions</h2><div class="inline"><button class="btn" onclick="location.hash='games';show('games')">Edit games and rules</button><button class="btn secondary" onclick="location.hash='users';show('users')">Find a user</button></div></section>`}
function gameCard(g){const counts=g.playerCounts||[2];return `<article class="card game" data-game="${esc(g.key)}"><div><div class="gamehead"><h2>${esc(g.name)}</h2><label class="switch"><input class="enabled" type="checkbox" ${g.available?'checked':''}> Enabled</label></div><p class="muted">${esc(g.description||'')}</p><b>Allowed room sizes</b><div class="counts">${[2,3,4].map(n=>`<label><input class="count" type="checkbox" value="${n}" ${counts.includes(n)?'checked':''}> ${n} players</label>`).join('')}</div><button class="btn save">Save settings</button> <span class="muted saved"></span></div><div><b>Rules, one per line</b><textarea class="rules">${esc((g.rules||[]).join('\n'))}</textarea></div></article>`}
function gamesPage(){content.innerHTML=head('Games & Rules','Enable games, choose room sizes, and edit rules.')+games.map(gameCard).join('');document.querySelectorAll('.game .save').forEach(b=>b.onclick=async()=>{const c=b.closest('.game'),counts=[...c.querySelectorAll('.count:checked')].map(x=>+x.value);if(!counts.length)return alert('Choose at least one player count.');b.disabled=true;try{await api('/admin-api/games/'+c.dataset.game,{method:'PUT',body:JSON.stringify({available:c.querySelector('.enabled').checked,playerCounts:counts,rules:c.querySelector('.rules').value.split('\n').map(x=>x.trim()).filter(Boolean)})});c.querySelector('.saved').textContent='Saved';setTimeout(()=>c.querySelector('.saved').textContent='',1500)}catch(x){alert(x.message)}finally{b.disabled=false}})}
function userRow(u){const suspended=u.suspendedUntil&&new Date(u.suspendedUntil)>new Date();return `<div class="user" data-user="${esc(u.id)}"><div><b>${esc(u.displayName||'Player')}</b> <span class="muted">${esc(u.phone||u.email||'')}</span><div class="muted">Coins: ${u.coins||0} · Penalties: ${u.penaltyPoints||0} ${suspended?`<span class="pill">Suspended until ${new Date(u.suspendedUntil).toLocaleString()}</span>`:''}</div><div class="muted">${esc(u.adminNote||'')}</div></div><div class="user-actions"><input class="input coins" type="number" min="0" placeholder="Coins"><input class="input minutes" type="number" min="0" placeholder="Minutes"><input class="input reason" placeholder="Reason"><button class="btn danger penalize">Penalize</button></div></div>`}
async function loadUsers(q=''){const d=await api('/admin-api/users?q='+encodeURIComponent(q));users=d.users||[]}
function usersPage(){content.innerHTML=head('Users & Penalties','Search accounts and apply coin deductions or timed suspensions.')+`<section class="card"><div class="inline"><input class="input" id="search" placeholder="Name, phone, or email"><button class="btn secondary" id="find">Search</button></div><div id="userList">${users.map(userRow).join('')||'<p class="muted">No users found.</p>'}</div></section>`;find.onclick=async()=>{await loadUsers(search.value);userList.innerHTML=users.map(userRow).join('')||'<p class="muted">No users found.</p>';bindPenalties()};bindPenalties()}
function bindPenalties(){document.querySelectorAll('.penalize').forEach(b=>b.onclick=async()=>{const r=b.closest('.user'),body={coins:r.querySelector('.coins').value||0,suspendMinutes:r.querySelector('.minutes').value||0,reason:r.querySelector('.reason').value};b.disabled=true;try{await api('/admin-api/users/'+r.dataset.user+'/penalize',{method:'POST',body:JSON.stringify(body)});await loadUsers(search?.value||'');userList.innerHTML=users.map(userRow).join('');bindPenalties()}catch(x){alert(x.message)}finally{b.disabled=false}})}
async function dashboard(){try{const[g,u]=await Promise.all([api('/admin-api/games'),api('/admin-api/users')]);games=g.games||[];users=u.users||[];layout(location.hash.slice(1)||'overview')}catch{login()}}
window.onhashchange=()=>{const p=location.hash.slice(1);if(document.querySelector('[data-page]'))show(p||'overview')};(async()=>{try{const s=await api('/admin-api/session');s.authenticated?dashboard():login()}catch{login()}})();
</script></body></html>
