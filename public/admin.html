<script>
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG'),num=n=>Number(n||0).toLocaleString('en-NG');
const dt=x=>x?new Date(x).toLocaleString('en-NG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'—';
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const debounce=(f,ms=350)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};
function left(ms){if(ms<=0)return'ended';const m=Math.floor(ms/6e4),h=Math.floor(m/60),d=Math.floor(h/24);return d?d+'d '+(h%24)+'h left':h?h+'h '+(m%60)+'m left':m+'m left'}
async function api(path,opt={}){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),25000);let r;try{r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},signal:ac.signal,...opt})}catch(e){throw Error(e&&e.name==='AbortError'?'The server took too long to answer. Try again in a moment.':'Could not reach the server: '+(e&&e.message||e))}finally{clearTimeout(tm)}const txt=await r.text();let d={};if(txt){try{d=JSON.parse(txt)}catch(e){if(r.ok)throw Error('The server sent an unexpected reply for '+path+' (it was not JSON). The backend may need redeploying.')}}if(!r.ok){if(r.status===401&&path!=='/admin-api/login'&&path!=='/admin-api/session')sessionLost();throw Object.assign(Error(d.message||('Request failed ('+r.status+')')),{status:r.status})}return d}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
let lost=false;function sessionLost(){if(lost)return;lost=true;login('Your session ended. Please sign in again.')}

 const close=v=>{document.removeEventListener('keydown',key);mb.remove();document.body.style.overflow='';prev&&prev.focus&&prev.focus();m.onclose&&m.onclose(v)};
 const key=e=>{if(e.key==='Escape'&&mb===[...$$('.mb')].pop())close();if(e.key==='Tab'){const f=$$('button:not(:disabled),input:not(:disabled),select,textarea,a[href]',mb);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}};

 const m={el:mb,close};setTimeout(()=>{const f=$('input:not([type=checkbox]),textarea,select',mb)||$('.btn:not(.sec)',mb);f&&f.focus()},30);return m}
const fieldHtml=f=>{const v=f.value??'',id='ask_'+f.name;const c=f.type==='textarea'?`<textarea class="in" id="${id}" maxlength="${f.max||240}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea>`:f.type==='select'?`<select class="in" id="${id}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input class="in" id="${id}" type="${f.type||'text'}" min="${f.min??''}" placeholder="${esc(f.placeholder||'')}" value="${esc(v)}" maxlength="${f.max||240}">`;return`<label class="f">${esc(f.label)}${c}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</label>`};
/* ask(): small form dialog. Resolves to {field:value} or null if cancelled. */
function ask({title,text='',fields=[],ok='Confirm',danger=false,extra=''}){return new Promise(res=>{let done=false;const m=openModal({title,body:(text?`<p class="mut" style="margin-bottom:12px">${text}</p>`:'')+extra+fields.map(fieldHtml).join(''),foot:`<button class="btn sec" data-c>Cancel</button><button class="btn ${danger?'bad':''}" data-ok>${esc(ok)}</button>`});
 const fin=v=>{if(done)return;done=true;res(v);m.close(v)};m.onclose=()=>{if(!done){done=true;res(null)}};
 $('[data-c]',m.el).onclick=()=>fin(null);$('[data-ok]',m.el).onclick=()=>{const o={};for(const f of fields){const el=$('#ask_'+f.name,m.el);o[f.name]=el.value.trim();if(f.required&&!o[f.name]){el.focus();el.style.borderColor='var(--bad)';return toast(f.label+' is required',true)}}fin(o)};

/* run(): disable a button while an action runs, then toast the result */
async function run(btn,fn,okMsg){if(btn)btn.disabled=true;try{const r=await fn();if(okMsg)toast(typeof okMsg==='function'?okMsg(r):okMsg);return r||true}catch(e){toast(e.message||'Something went wrong',true);return false}finally{if(btn&&btn.isConnected)btn.disabled=false}}

 $$('[data-tc]').forEach(b=>b.onclick=async()=>{if(!await sure('Cancel tournament?','Every registered player is refunded their fee.','Cancel & refund',true))return;if(await run(b,()=>post('/admin-api/tournaments/'+b.dataset.tc+'/cancel'),r=>'Cancelled. Refunded '+r.refunded+' player(s) ✓'))tournamentsPage()})}

/* ================= ELECTIONS ================= */
async function electionsPage(){const d=await api('/admin-api/ac/elections'),gs=await api('/admin-api/ac/gov-settings').catch(()=>({offices:[]}));
 const L=ms=>new Date(ms+3600000).toISOString().replace('T',' ').slice(0,16),parse=v=>v?Date.parse(v+':00+01:00'):NaN,nowL=new Date(Date.now()+3600000).toISOString().slice(0,16);
 const rows=d.rounds.slice().reverse();
 view().innerHTML=head('Elections','You are the electoral commission. Players can file, back candidates and vote only while an election you scheduled is open. Times are Lagos time (WAT).')+`${govCard(gs)}<div class="grid2"><div class="card"><div class="ch"><h2>Schedule the next election</h2></div><label class="f">Campaign opens<input class="in" type="datetime-local" id="el_s" min="${nowL}"><span class="hint">Filing and backing start</span></label><label class="f">Ballot is set, voting opens<input class="in" type="datetime-local" id="el_b"></label><label class="f">Polls close, winner announced<input class="in" type="datetime-local" id="el_e"></label><button class="btn" id="el_go">Schedule election</button></div><div class="card"><div class="ch"><h2>Elections</h2></div>${rows.length?`<div class="tw"><table class="rs"><thead><tr><th>#</th><th>Opens</th><th>Voting</th><th>Closes</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td class="first"><b>#${r.n}</b></td><td data-l="Opens">${L(r.start)}</td><td data-l="Voting">${L(r.shortlistAt)}</td><td data-l="Closes">${L(r.end)}</td><td data-l="Status">${badge(r.status)}</td><td class="ac"><div class="acts" style="justify-content:flex-end">${r.status!=='closed'?`<button class="btn sec sm" data-ered="${r.n}">Edit</button>`:''}<button class="btn sec sm" data-ecamp="${r.n}">Campaigns</button><button class="btn bad sm" data-edel="${r.n}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('No elections scheduled','Players see “No election is on right now”.')}</div></div>`;
 bindGov(gs);$('#el_go').onclick=async e=>{if(await run(e.target,()=>post('/admin-api/ac/elections',{start:parse($('#el_s').value),shortlistAt:parse($('#el_b').value),end:parse($('#el_e').value)}),'Election scheduled ✓'))electionsPage()};
 $$('[data-ered]').forEach(b=>b.onclick=()=>editRound(rows.find(r=>String(r.n)===b.dataset.ered)));
 $$('[data-ecamp]').forEach(b=>b.onclick=()=>campaignsModal(rows.find(r=>String(r.n)===b.dataset.ecamp)));
 $$('[data-edel]').forEach(b=>b.onclick=async()=>{const r=rows.find(x=>String(x.n)===b.dataset.edel),fin=r.status==='closed';if(!await sure('Delete election #'+r.n+'?',fin?'This only removes the finished election from the record. The sitting officeholder keeps the office.':'Every candidate gets their filing fee back and is told. Votes and backing for this election are removed.','Delete election',true))return;const x=await run(b,()=>api('/admin-api/ac/elections/'+r.n,{method:'DELETE'}),r=>r.people?'Deleted. '+money(r.refunded)+' refunded to '+r.people+' candidate(s).':'Election deleted');if(x)electionsPage()})}

const LAGOS_L=ms=>new Date(ms+3600000).toISOString().slice(0,16),LAGOS_P=v=>v?Date.parse(v+':00+01:00'):NaN;
function govCard(gs){const O=gs.offices||[];if(!O.length)return'';return`<div class="card" style="margin-bottom:14px"><div class="ch"><h2>Cost of contesting</h2></div><p class="sub" style="margin-bottom:10px">What a player pays to file for each office, the allowance the winner receives, and who may run. Players who already filed keep the fee they paid. Changes apply within about 30 seconds.</p><div class="tw"><table class="rs"><thead><tr><th>Office</th><th>Filing fee (₦)</th><th>Winner allowance (₦)</th><th>Min account age (days)</th><th>Min followers</th></tr></thead><tbody>${O.map(o=>`<tr><td class="first"><b>${esc(o.icon+' '+o.title)}</b><div class="sub">${esc(o.scope)}</div></td>${['fee','salary','minAgeDays','minFollowers'].map(k=>`<td data-l="${k}"><input class="in" type="number" min="0" id="gv_${o.id}_${k}" value="${o[k]}" style="min-width:110px"><div class="sub">default ${num(o.defaults[k])}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="acts" style="margin-top:12px"><button class="btn" id="gv_save">Save amounts</button><button class="btn sec" id="gv_reset">Reset to defaults</button></div></div>`}
function bindGov(gs){const sv=$('#gv_save');if(!sv)return;const O=gs.offices||[];
 sv.onclick=async e=>{const offices={};O.forEach(o=>{offices[o.id]={};['fee','salary','minAgeDays','minFollowers'].forEach(k=>offices[o.id][k]=$('#gv_'+o.id+'_'+k).value)});if(await run(e.target,()=>post('/admin-api/ac/gov-settings',{offices}),'Amounts saved ✓'))electionsPage()};
 $('#gv_reset').onclick=()=>O.forEach(o=>['fee','salary','minAgeDays','minFollowers'].forEach(k=>$('#gv_'+o.id+'_'+k).value=o.defaults[k]))}
async function editRound(r){const v=await ask({title:'Edit election #'+r.n,text:'Times are Lagos time (WAT). '+(r.status==='upcoming'?'You can change all three dates.':r.status==='campaign'?'The campaign is open, so the opening date is fixed.':'Voting is open, so only the closing date can change.'),ok:'Save dates',fields:[{name:'start',label:'Campaign opens',type:'datetime-local',value:LAGOS_L(r.start)},{name:'shortlistAt',label:'Ballot is set, voting opens',type:'datetime-local',value:LAGOS_L(r.shortlistAt)},{name:'end',label:'Polls close, winner announced',type:'datetime-local',value:LAGOS_L(r.end)}]});if(!v)return;
 if(await run(null,()=>putJson('/admin-api/ac/elections/'+r.n,{start:LAGOS_P(v.start),shortlistAt:LAGOS_P(v.shortlistAt),end:LAGOS_P(v.end)}),'Election updated'))electionsPage()}
async function campaignsModal(r){let m;const draw=async()=>{let d;try{d=await api('/admin-api/ac/elections/'+r.n+'/campaigns')}catch(e){return toast(e.message,true)}const rows=d.campaigns||[];
  const html=rows.length?`<div class="tw"><table class="rs"><thead><tr><th>Candidate</th><th>Race</th><th>Slogan</th><th class="r">Backers</th><th class="r">Fee</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td class="first"><b>${esc(c.name)}</b><div class="sub">${c.username?'@'+esc(c.username):''}${c.onBallot?' · on ballot':''}</div></td><td data-l="Race">${esc(c.title)}</td><td data-l="Slogan">${esc(c.slogan)}</td><td class="r" data-l="Backers">${num(c.backers)}</td><td class="r" data-l="Fee">${money(c.fee)}${c.refunded?'<div class="sub">refunded</div>':''}</td><td class="ac"><div class="acts" style="justify-content:flex-end"><button class="btn sec sm" data-ce="${esc(c.office)}:${esc(c.user)}">Edit</button><button class="btn bad sm" data-cr="${esc(c.office)}:${esc(c.user)}">Remove</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('No campaigns','Nobody has filed in this election.');
  if(!m){m=openModal({wide:true,title:'Campaigns · election #'+r.n,sub:'Edit a slogan or remove a campaign (the filing fee is refunded).',body:'<div id="cmp"></div>',foot:'<button class="btn sec" data-c>Close</button>'});$('[data-c]',m.el).onclick=()=>m.close()}
  const box=$('#cmp',m.el);box.innerHTML=html;
  box.onclick=async e=>{const be=e.target.closest('[data-ce]'),br=e.target.closest('[data-cr]');
   if(be){const [o,u]=be.dataset.ce.split(':'),c=rows.find(x=>x.office===o&&x.user===u),v=await ask({title:'Edit slogan',text:esc(c.name),ok:'Save',fields:[{name:'slogan',label:'Slogan',value:c.slogan,required:true,max:80}]});if(!v)return;if(await run(null,()=>putJson('/admin-api/ac/elections/'+r.n+'/campaigns/'+o+'/'+u,{slogan:v.slogan}),'Slogan updated'))draw()}
   if(br){const [o,u]=br.dataset.cr.split(':'),c=rows.find(x=>x.office===o&&x.user===u);if(!await sure('Remove this campaign?',esc(c.name)+' is taken off the '+esc(c.title)+' race, their backers\u2019 support for them is cleared and the filing fee is refunded.','Remove',true))return;if(await run(null,()=>api('/admin-api/ac/elections/'+r.n+'/campaigns/'+o+'/'+u,{method:'DELETE'}),x=>x.refunded?'Removed. '+money(x.refunded)+' refunded.':'Removed'))draw()}}};draw()}

/* ================= GEM HUNT ================= */
async function gemPage(){const d=await api('/admin-api/ac/gem'),g=d.config,pz=g.prizes,tg=(id,v,t,s)=>`<div class="sw"><label class="tg"><input type="checkbox" id="${id}" ${v?'checked':''}><i></i></label><span>${t}<div class="sub">${s}</div></span></div>`;
 view().innerHTML=head('Daily gem hunt','Players read the clue, walk to the landmark you pick, and the gem sparkles. A new gem starts every day at midnight (Lagos time).')+`<div class="grid2"><div class="card">${tg('gEn',g.enabled,'Gem hunt is on','Turn off to hide it and stop all claims')}${tg('gPl',g.placeOn,'Place enabled','Gem sparkles at the landmark. Off = nobody can find it')}${tg('gClOn',g.clueOn,'Show the clue','Players see today’s clue')}${tg('gHiOn',g.hintOn,'Offer a hint','Players can tap “Need a hint?”')}<label class="f" style="margin-top:12px">Where the gem is<select class="in" id="gPlace">${d.places.map(p=>`<option ${p===g.place?'selected':''}>${esc(p)}</option>`).join('')}</select></label><label class="f">Today’s clue<textarea class="in" id="gClue" maxlength="240" placeholder="Describe the place without naming it">${esc(g.clue)}</textarea></label><label class="f">Hint text<textarea class="in" id="gHint" maxlength="240" placeholder="e.g. It is on the island side of the city">${esc(g.hint)}</textarea></label></div><div class="card"><div class="ch"><h2>Prizes</h2></div><p class="sub" style="margin-bottom:10px">₦ per finder, by order of finding.</p><div class="row"><label class="f">1st<input class="in" type="number" min="0" id="p1" value="${pz.first}"></label><label class="f">2nd – 3rd<input class="in" type="number" min="0" id="p2" value="${pz.second}"></label><label class="f">4th – 10th<input class="in" type="number" min="0" id="p4" value="${pz.fourth}"></label><label class="f">After that<input class="in" type="number" min="0" id="p11" value="${pz.after}"></label></div><button class="btn" id="gSave" style="margin-top:8px">Save gem hunt</button></div></div>`;
 $('#gSave').onclick=e=>{const v=id=>$('#'+id);run(e.target,()=>post('/admin-api/ac/gem',{config:{enabled:v('gEn').checked,placeOn:v('gPl').checked,place:v('gPlace').value,clueOn:v('gClOn').checked,clue:v('gClue').value,hintOn:v('gHiOn').checked,hint:v('gHint').value,prizes:{first:+v('p1').value,second:+v('p2').value,fourth:+v('p4').value,after:+v('p11').value}}}),'Gem hunt saved ✓')}}

function gamesPage(){view().innerHTML=head('Games & rules','Enable games, choose room sizes and edit the rules players see.')+`<div class="row" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))">${games.map(g=>{const cs=g.playerCounts||[2];return`<div class="card" data-game="${esc(g.key)}"><div class="ch"><h2>${esc(g.name)}</h2><label class="tg" title="Enabled"><input class="enabled" type="checkbox" ${g.available?'checked':''} aria-label="Enabled"><i></i></label></div><p class="sub" style="margin-bottom:12px">${esc(g.description||'')}</p><div class="sub" style="margin-bottom:6px;font-weight:700">Room sizes</div><div class="chips" style="margin-bottom:12px">${[2,3,4].map(n=>`<label class="chip" style="cursor:pointer"><input class="count" type="checkbox" value="${n}" ${cs.includes(n)?'checked':''}> ${n} players</label>`).join('')}</div><label class="f">Rules (one per line)<textarea class="in rules">${esc((g.rules||[]).join('\n'))}</textarea></label><button class="btn save">Save</button></div>`}).join('')}</div>`;
 $$('.save').forEach(b=>b.onclick=async()=>{const c=b.closest('[data-game]'),cs=$$('.count:checked',c).map(x=>+x.value);if(!cs.length)return toast('Choose at least one room size.',true);await run(b,()=>api('/admin-api/games/'+c.dataset.game,{method:'PUT',body:JSON.stringify({available:$('.enabled',c).checked,playerCounts:cs,rules:$('.rules',c).value.split('\n').map(x=>x.trim()).filter(Boolean)})}),'Saved ✓');const g=games.find(x=>x.key===c.dataset.game);if(g){g.available=$('.enabled',c).checked}})}
