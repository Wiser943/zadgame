:root{font-family:Inter,system-ui,sans-serif;color:#20232a;background:#f4f5f8;--red:#b5222c;--line:#e1e3ea;--muted:#697080}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#20232a;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:900;padding:0 12px 22px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#cbd0da;text-align:left;border-radius:10px;padding:12px;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{background:#3a3f49;color:#fff}.logout{margin:30px 12px 0;width:calc(100% - 24px)}.main{max-width:1280px;width:100%;padding:28px clamp(16px,4vw,42px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 18px #20232a0d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.stat{padding:18px;border-radius:15px;background:#fff;border:1px solid var(--line)}.stat b{display:block;font-size:28px;margin-top:6px}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eef0f5;color:#252936}.btn.danger{background:#8c1821}.btn:disabled{opacity:.5}.input,textarea{width:100%;border:1px solid #d8dbe4;border-radius:10px;padding:11px 12px;font:inherit;margin:6px 0 12px;background:#fff}textarea{min-height:150px;resize:vertical}.game{display:grid;grid-template-columns:1fr 1.3fr;gap:22px}.gamehead,.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.switch{display:flex;align-items:center;gap:7px;font-size:13px}.counts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}.counts label{padding:9px 11px;border:1px solid var(--line);border-radius:9px}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline .input{width:auto;flex:1;margin:0}.user{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;border-top:1px solid #eceef3;padding:15px 0}.user-actions{display:flex;gap:7px;flex-wrap:wrap}.user-actions .input{width:110px;margin:0}.user-actions .reason{width:190px}.pill{font-size:11px;background:#fff0d7;color:#875a00;border-radius:999px;padding:4px 8px}.login{max-width:420px;margin:12vh auto}.error{color:var(--red);font-size:13px;margin:8px 0}.hidden{display:none}@media(max-width:760px){.shell{display:block}.side{height:auto;position:sticky;top:0;z-index:3;padding:12px}.brand{padding:5px 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px}.logout{position:absolute;right:10px;top:10px;width:auto;margin:0;padding:8px 10px}.main{padding:18px 12px}.grid,.game{grid-template-columns:1fr}.card{padding:16px;border-radius:14px}.top{align-items:flex-start}.top .btn{white-space:nowrap}.user{grid-template-columns:1fr}.user-actions{display:grid;grid-template-columns:1fr 1fr}.user-actions .input,.user-actions .reason{width:100%}.user-actions .btn{grid-column:1/-1}}

/* Responsive, brand-aligned admin refresh */
:root{--admin-blue:#075BFF;--admin-blue-dark:#0649CC;--admin-gold:#FFC400;--admin-purple:#9C27F5;--admin-orange:#FF9D00;--admin-ink:#111B46;--line:#e2e7f1;--muted:#64708a;background:#f4f6fb;color:#17213a;accent-color:var(--admin-blue)}
body{background:#f4f6fb;color:#17213a;line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{grid-template-columns:258px minmax(0,1fr);gap:0}
.side{background:linear-gradient(180deg,#111b46 0%,#0c1433 100%);border-right:1px solid #27335e;padding:22px 14px;display:flex;flex-direction:column;gap:14px;z-index:10}
.brand{display:flex;align-items:center;font-size:18px;letter-spacing:-.35px;padding:4px 10px 22px;white-space:nowrap}
.brand img{flex:0 0 auto}
.nav{gap:5px;align-content:start}
.nav button{min-height:42px;color:#c7d1ee;border:1px solid transparent;transition:background .16s,border-color .16s,color .16s}
.nav button:hover{background:#1b2a5b;border-color:#30427d;color:#fff}
.nav button.active{background:linear-gradient(100deg,#075bff38,#9c27f51a);border-color:#467dff;color:#fff;box-shadow:inset 3px 0 0 var(--admin-gold)}
.logout{margin:auto 8px 0;width:calc(100% - 16px);background:#25345e;color:#fff;border:1px solid #465783}
.main{max-width:1500px;padding:clamp(18px,3vw,42px);min-width:0}
.top{align-items:flex-start;margin-bottom:24px}.top h1{font-size:clamp(25px,3vw,34px);letter-spacing:-.8px;line-height:1.15}.muted{line-height:1.5;color:#66728b}
.card,.stat{border-color:#e1e7f2;box-shadow:0 8px 26px rgba(17,27,70,.055);min-width:0}.card{padding:clamp(16px,2vw,24px);margin:16px 0;border-radius:18px}.stat{border-radius:16px;transition:transform .15s,box-shadow .15s}.stat:hover{transform:translateY(-2px);box-shadow:0 12px 28px #111b4612}.stat b{color:var(--admin-ink);font-size:clamp(24px,3vw,32px);letter-spacing:-.7px}
.btn{background:var(--admin-blue);box-shadow:0 2px 5px #075bff22;transition:filter .15s,transform .15s,box-shadow .15s;min-height:40px}.btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 5px 14px #075bff2b;transform:translateY(-1px)}.btn.secondary{background:#eef2ff;color:#1c3474;box-shadow:none;border:1px solid #dce4ff}.btn.danger{background:#b42335;box-shadow:none}.btn:focus-visible,.input:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:3px solid #ffc400;outline-offset:2px}
.input,textarea{border-color:#d8e0ef;border-radius:11px;min-height:42px;transition:border-color .15s,box-shadow .15s}.input:focus,textarea:focus{outline:none;border-color:var(--admin-blue);box-shadow:0 0 0 3px #075bff18}textarea{min-height:150px}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,205px),1fr));gap:14px}.game{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px}.game h2{font-size:clamp(18px,2vw,22px)}.counts label{background:#f8faff;border-color:#dfe6f3}.counts input{accent-color:var(--admin-blue)}
.user{grid-template-columns:minmax(0,1fr) minmax(260px,auto);gap:18px}.user-actions{align-items:center}.user-actions .input{min-width:0}.pill{background:#fff5cc;color:#765300;font-weight:750}.admin-notice{background:#111b46;border:1px solid #354578;box-shadow:0 14px 40px #111b4633}.admin-notice.bad{background:#9f1d2d}
/* Long content should never force the page wider than the viewport. */
#content,section,.user>div,.game>div{min-width:0;overflow-wrap:anywhere}.inline{align-items:center}.inline .input{min-width:0}.user-actions .reason{max-width:100%}
@media(max-width:1050px){.shell{grid-template-columns:220px minmax(0,1fr)}.side{padding:18px 10px}.main{padding:22px 18px}.game{grid-template-columns:1fr}.user{grid-template-columns:1fr}.user-actions{display:flex}.user-actions .input{flex:1 1 120px}}
@media(max-width:760px){.shell{display:flex;flex-direction:column}.side{position:sticky;top:0;height:auto;max-height:none;padding:10px 12px;gap:7px;border-right:0;border-bottom:1px solid #27335e;box-shadow:0 6px 18px #0c143322}.brand{padding:2px 4px 7px;font-size:16px}.brand img{width:27px!important;height:27px!important}.nav{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:1px 1px 7px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.nav button{flex:0 0 auto;min-height:38px;padding:8px 11px;font-size:13px}.nav button.active{box-shadow:inset 0 -3px 0 var(--admin-gold)}.logout{position:static;width:auto;margin:0 0 2px;align-self:flex-end;min-height:34px;padding:6px 12px;font-size:12px}.main{padding:18px 12px 32px}.top{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}.top h1{font-size:27px}.card{padding:15px;margin:12px 0;border-radius:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px}.stat b{font-size:25px}.game{grid-template-columns:minmax(0,1fr);gap:16px}.gamehead,.sectionhead{align-items:flex-start;flex-wrap:wrap}.inline{width:100%}.inline .input{flex:1 1 100%;width:100%}.user{grid-template-columns:minmax(0,1fr);gap:12px;padding:14px 0}.user-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.user-actions .input,.user-actions .reason{width:100%;max-width:none;min-width:0}.user-actions .btn{min-width:0;padding:9px 10px}.user-actions .penalize{grid-column:1/-1}.counts{gap:6px}.counts label{padding:8px}.admin-notice{right:12px;bottom:12px;max-width:calc(100vw - 24px)}}
@media(max-width:390px){.main{padding-inline:9px}.grid{grid-template-columns:1fr}.user-actions{grid-template-columns:1fr}.user-actions .penalize{grid-column:auto}.top h1{font-size:24px}.card{padding:13px}.btn{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

</head><body><div id="root"></div><script>
const root=document.getElementById('root'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(d.message||('Request failed ('+r.status+')')),{status:r.status});return d}
function adminNotice(message,bad=false){const old=document.querySelector('.admin-notice');old?.remove();const n=document.createElement('div');n.className='admin-notice'+(bad?' bad':'');n.textContent=message;document.body.appendChild(n);setTimeout(()=>n.remove(),3000)}
async function login(msg){let cfg=null;try{cfg=await api('/admin-api/status')}catch(e){}
  if(cfg&&cfg.configured===false)msg='Admin login is not configured on the server. Add ADMIN_PHONE and ADMIN_PIN in your environment settings, then redeploy.';
  root.innerHTML='<section class="card login"><h1>AllConnect Admin</h1><p class="muted">Restricted administration area</p><form id="login-form"><label>Admin phone<input class="input" id="phone" autocomplete="username" required></label><label>PIN<input class="input" id="pin" type="password" autocomplete="current-password" required></label><div id="err" class="error"></div><button class="btn">Sign in</button></form></section>';
  const f=document.getElementById('login-form'),er=document.getElementById('err');if(msg)er.textContent=msg;
  f.addEventListener('submit',async e=>{e.preventDefault();er.textContent='';const b=f.querySelector('button');b.disabled=true;
    try{await api('/admin-api/login',{method:'POST',body:JSON.stringify({phone:document.getElementById('phone').value.trim(),pin:document.getElementById('pin').value})});location.hash='overview';await dashboard()}
    catch(x){er.textContent=x.message||'Could not sign in. Try again.'}b.disabled=false})}
let games=[],users=[];function layout(page){root.innerHTML=`<div class="shell"><aside class="side"><div class="brand"><img src="/icon-192.png" alt="" style="width:30px;height:30px;border-radius:8px;vertical-align:-8px;margin-right:8px">AllConnect Admin</div><nav class="nav"><button data-page="overview">Overview</button><button data-page="games">Games & Rules</button><button data-page="users">Users & Penalties</button><button data-page="reports">Reports</button><button data-page="tournaments">Tournaments</button><button data-page="announce">Announcements</button><button data-page="gem">Gem hunt</button><button data-page="socials">Social links</button><button data-page="photos">Photo storage</button><button data-page="metrics">Analytics</button></nav><button class="btn danger logout" id="logout">Log out</button></aside><main class="main" id="content"></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.page;show(b.dataset.page)});logout.onclick=async()=>{await api('/admin-api/logout',{method:'POST'});login()};show(page||'overview')}
function show(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='games')gamesPage();else if(page==='users')usersPage();else if(page==='reports')reportsPage();else if(page==='tournaments')tournamentsPage();else if(page==='announce')announcePage();else if(page==='gem')gemPage();else if(page==='socials')socialsPage();else if(page==='photos')photosPage();else if(page==='metrics')metricsPage();else overviewPage()}


async function photosPage(){const c=document.getElementById('content');
  const draw=async()=>{let st;try{st=await api('/admin-api/ac/photo-status')}catch(e){return adminNotice(e.message,true)}
    c.innerHTML=head('Photo storage','Camera and gallery photos are uploaded to imgbb. If imgbb is not set up or fails, photos are kept in our own database instead, so players never see an error.')+`<section class="card"><p><b>Key on the server:</b> ${st.configured?`found in <code>${esc(st.variable)}</code> — ${esc(st.keyPreview)}`:'<span style="color:#b5222c">not found</span>. Add <code>IMGBB_KEY</code> in Render → Environment, then redeploy.'}</p><p><b>Last real upload:</b> ${st.last.lastAt?(st.last.lastOk?'✅ worked':'❌ '+esc(st.last.lastError))+' <span class="muted">('+new Date(st.last.lastAt).toLocaleString()+')</span>':'none yet'}</p><button class="btn" id="phtest">Test imgbb now</button><p id="phres" class="muted" style="margin-top:10px"></p></section>`;
    document.getElementById('phtest').onclick=async()=>{const b=document.getElementById('phtest'),o=document.getElementById('phres');b.disabled=true;o.textContent='Testing…';try{const r=await api('/admin-api/ac/photo-test',{method:'POST'});o.innerHTML=r.ok?'✅ '+esc(r.message):'❌ '+esc(r.message)+(r.status?' (HTTP '+r.status+')':'')}catch(e){o.textContent=e.message}b.disabled=false}};
  draw()}
async function socialsPage(){const c=document.getElementById('content');const N=[['x','X (Twitter)','https://x.com/yourhandle'],['tiktok','TikTok','https://www.tiktok.com/@yourhandle'],['instagram','Instagram','https://www.instagram.com/yourhandle'],['linkedin','LinkedIn','https://www.linkedin.com/company/yourpage']];
  c.innerHTML=head('Social links','These show in the footer of the login screen and in Settings. Leave a box empty to hide that network. If every box is empty, the footer is hidden completely.')+'<section class="card"><p class="muted">Loading…</p></section>';
  let cur={};try{cur=(await api('/admin-api/ac/socials')).socials}catch(e){return adminNotice(e.message,true)}
  c.innerHTML=head('Social links','These show in the footer of the login screen and in Settings. Leave a box empty to hide that network. If every box is empty, the footer is hidden completely.')+'<section class="card">'+N.map(n=>`<label>${n[1]}<input class="input" id="soc_${n[0]}" placeholder="${n[2]}" value="${esc(cur[n[0]]||'')}"></label>`).join('')+'<button class="btn" id="socb">Save</button></section>';
  document.getElementById('socb').onclick=async()=>{const socials={};N.forEach(n=>socials[n[0]]=document.getElementById('soc_'+n[0]).value.trim());try{await api('/admin-api/ac/socials',{method:'POST',body:JSON.stringify({socials})});adminNotice('Saved ✓ Players see it within seconds')}catch(e){adminNotice(e.message,true)}}}
async function tournamentsPage(){const c=document.getElementById('content'),N=n=>'₦'+Math.floor(n).toLocaleString('en-NG');
  let d;try{d=await api('/admin-api/tournaments')}catch(e){return adminNotice(e.message,true)}
  const D=d.defaults.prizes,sel=(id,opts)=>`<select class="input" id="${id}">${opts.map(o=>`<option value="${o[0]}"${o[2]?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  const row=t=>`<div class="inline" style="justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap"><div><b>${esc(t.name)}</b> <span class="muted">· ${esc(t.game)} · ${t.count}/${t.maxPlayers} players (min ${t.minPlayers}) · ${esc(t.status)}</span><div class="muted">Entry ${N(t.entryFee)} · 🏆 ${N(t.prizes.champion.coins)} + ${t.prizes.champion.xp} XP · 🥈 ${N(t.prizes.runnerUp.coins)} + ${t.prizes.runnerUp.xp} XP${t.minLevel>1?' · level '+t.minLevel+'+':''}${t.startsAt?' · starts '+new Date(t.startsAt).toLocaleString():''}</div></div>${t.status==='open'?`<div class="inline" style="gap:8px"><button class="btn" data-ts="${t.id}">Start now</button><button class="btn danger" data-tc="${t.id}">Cancel &amp; refund</button></div>`:''}</div>`;
  c.innerHTML=head('Tournaments','Only you create, price and start tournaments. Players can only join (paying the registration fee) or leave (the fee is refunded until it starts). Prizes are paid from the platform into the winners\' balance.')+`<section class="card"><h3 style="margin-top:0">New tournament</h3>
  <label>Name (optional)<input class="input" id="tn" maxlength="40" placeholder="e.g. Friday Chess Cup"></label>
  <label>Game${sel('tg',d.games.map(g=>[g.key,g.name]))}</label>
  <div class="inline" style="gap:12px;flex-wrap:wrap"><label style="flex:1">Bracket size${sel('ts',[[4,'4 players'],[8,'8 players',1],[16,'16 players']])}</label><label style="flex:1">Minimum players to start<input class="input" id="tm" type="number" min="4" value="4"></label><label style="flex:1">Minimum level<input class="input" id="tl" type="number" min="1" max="50" value="1"></label></div>
  <label>Starts${sel('tt',[[0,'When full (or when I press Start)',1],[10,'In 10 minutes'],[30,'In 30 minutes'],[60,'In 1 hour'],[180,'In 3 hours'],[1440,'In 24 hours']])}</label>
  <label>Registration fee, ₦ (required, minimum ${N(d.minFee)})<input class="input" id="tf" type="number" min="${d.minFee}" value="${d.minFee}"></label>
  <div class="inline" style="gap:12px;flex-wrap:wrap"><label style="flex:1">Champion prize, ₦<input class="input" id="pc" type="number" min="0" value="${D.champion.coins}"></label><label style="flex:1">Champion XP<input class="input" id="px" type="number" min="0" value="${D.champion.xp}"></label></div>
  <div class="inline" style="gap:12px;flex-wrap:wrap"><label style="flex:1">Runner-up prize, ₦<input class="input" id="pr" type="number" min="0" value="${D.runnerUp.coins}"></label><label style="flex:1">Runner-up XP<input class="input" id="py" type="number" min="0" value="${D.runnerUp.xp}"></label></div>
  <button class="btn" id="tcreate">Create tournament</button></section>
  <section class="card"><h3 style="margin-top:0">All tournaments</h3>${d.tournaments.length?d.tournaments.map(row).join(''):'<p class="muted">None yet.</p>'}</section>`;
  const v=id=>document.getElementById(id).value;
  document.getElementById('tcreate').onclick=async()=>{try{await api('/admin-api/tournaments',{method:'POST',body:JSON.stringify({name:v('tn'),game:v('tg'),maxPlayers:+v('ts'),minPlayers:+v('tm'),minLevel:+v('tl'),startInMinutes:+v('tt'),entryFee:+v('tf'),championCoins:+v('pc'),championXp:+v('px'),runnerUpCoins:+v('pr'),runnerUpXp:+v('py')})});adminNotice('Tournament created ✓ Players were notified');tournamentsPage()}catch(e){adminNotice(e.message,true)}};
  c.querySelectorAll('[data-ts]').forEach(b=>b.onclick=async()=>{try{await api('/admin-api/tournaments/'+b.dataset.ts+'/start',{method:'POST'});adminNotice('Started ✓');tournamentsPage()}catch(e){adminNotice(e.message,true)}});
  c.querySelectorAll('[data-tc]').forEach(b=>b.onclick=async()=>{if(!confirm('Cancel this tournament and refund every registered player?'))return;try{const r=await api('/admin-api/tournaments/'+b.dataset.tc+'/cancel',{method:'POST'});adminNotice('Cancelled. Refunded '+r.refunded+' player(s) ✓');tournamentsPage()}catch(e){adminNotice(e.message,true)}})}
function announcePage(){const c=document.getElementById('content');
  c.innerHTML=head('Announcements',"Post news to every player's Updates feed. Players who are online see it instantly.")+`<section class="card"><label>Message<textarea id="ann" maxlength="240" placeholder="e.g. Weekend tournament starts Saturday!"></textarea></label><label>Type<select class="input" id="annk"><option value="admin">📢 Announcement</option><option value="update">🆕 App update</option></select></label><button class="btn" id="annb">Post to all players</button></section>`;
  document.getElementById('annb').onclick=async()=>{const t=document.getElementById('ann').value.trim();if(!t)return adminNotice('Write a message first',true);
    try{await api('/admin-api/ac/post',{method:'POST',body:JSON.stringify({text:t,kind:document.getElementById('annk').value})});document.getElementById('ann').value='';adminNotice('Posted to all players ✓')}catch(e){adminNotice(e.message,true)}}}
async function gemPage(){const c=document.getElementById('content');
  c.innerHTML=head('Daily gem hunt','Players tap Daily gem hunt on the home screen, read the clue, walk to the landmark you pick, and the gem sparkles. A new gem starts every day at midnight (Lagos time).')+'<section class="card"><p class="muted">Loading...</p></section>';
  let d;try{d=await api('/admin-api/ac/gem')}catch(e){return adminNotice(e.message,true)}
  const g=d.config,pz=g.prizes,chk=(id,v,t)=>`<label style="display:flex;gap:10px;align-items:center;margin:10px 0"><input type="checkbox" id="${id}" ${v?'checked':''} style="width:auto"> <span>${t}</span></label>`;
  c.querySelector('section').outerHTML=`<section class="card">
    ${chk('gEn',g.enabled,'<b>Gem hunt is ON</b> (turn off to hide it and stop all claims)')}
    ${chk('gPl',g.placeOn,'<b>Place enabled</b> (gem sparkles at the landmark below. Off = nobody can find it)')}
    <label>Where the gem is<select class="input" id="gPlace">${d.places.map(p=>`<option ${p===g.place?'selected':''}>${esc(p)}</option>`).join('')}</select></label>
    ${chk('gClOn',g.clueOn,'<b>Show the clue</b> to players')}
    <label>Today\'s clue<textarea id="gClue" maxlength="240" placeholder="Describe the place without naming it">${esc(g.clue)}</textarea></label>
    ${chk('gHiOn',g.hintOn,'<b>Offer a hint</b> button (players tap "Need a hint?")')}
    <label>Hint text<textarea id="gHint" maxlength="240" placeholder="e.g. It is on the island side of the city">${esc(g.hint)}</textarea></label>
    <h3>Prizes (₦ per finder, by order of finding)</h3>
    <div class="inline"><label>1st<input class="input" type="number" min="0" id="p1" value="${pz.first}"></label><label>2nd to 3rd<input class="input" type="number" min="0" id="p2" value="${pz.second}"></label><label>4th to 10th<input class="input" type="number" min="0" id="p4" value="${pz.fourth}"></label><label>After that<input class="input" type="number" min="0" id="p11" value="${pz.after}"></label></div>
    <button class="btn" id="gSave">Save gem hunt</button></section>`;
  document.getElementById('gSave').onclick=async()=>{const v=id=>document.getElementById(id);
    const config={enabled:v('gEn').checked,placeOn:v('gPl').checked,place:v('gPlace').value,clueOn:v('gClOn').checked,clue:v('gClue').value,hintOn:v('gHiOn').checked,hint:v('gHint').value,prizes:{first:+v('p1').value,second:+v('p2').value,fourth:+v('p4').value,after:+v('p11').value}};
    try{await api('/admin-api/ac/gem',{method:'POST',body:JSON.stringify({config})});adminNotice('Gem hunt saved ✓')}catch(e){adminNotice(e.message,true)}}}
async function metricsPage(){
  content.innerHTML=head('Analytics','Last 7 days. Aggregate counts only.')+'<section class="card" id="mBox"><p class="muted">Loading...</p></section>';
  let m;try{m=await api('/admin-api/metrics')}catch(e){mBox.innerHTML='<p class="muted">Could not load metrics.</p>';return}
  const stat=(l,v)=>`<div class="card" style="flex:1;min-width:140px;text-align:center"><div style="font-size:24px;font-weight:800">${esc(v)}</div><div class="muted">${esc(l)}</div></div>`;
  const max=Math.max(1,...m.games.map(g=>g.matches));
  mBox.innerHTML=`<div class="inline" style="flex-wrap:wrap">${stat('Online now',m.onlineNow)}${stat('Active players (24h)',m.activePlayers24h)}${stat('New users',m.newUsers)}${stat('Matches',m.matches)}${stat('Ranked matches',m.rankedMatches)}${stat('Matches with a bot',m.botMatchShare+'%')}${stat('Abandoned / forfeited',m.abandonRate+'%')}${stat('Open reports',m.openReports)}${stat('Tournaments open / live',m.tournaments.open+' / '+m.tournaments.running)}</div>
  <h3>Game popularity</h3>${m.games.length?m.games.map(g=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>${esc(g.game)}</span><span class="muted">${g.matches} matches${g.avgMinutes!=null?' · avg '+g.avgMinutes+' min':''}</span></div><div style="height:8px;border-radius:99px;background:#ddd;overflow:hidden"><div style="height:100%;width:${Math.round(100*g.matches/max)}%;background:#b3141c"></div></div></div>`).join(''):'<p class="muted">No matches yet.</p>'}`;
}
let reportFilter='open';
async function reportsPage(){
  content.innerHTML=head('Reports','Review player reports. Every action is logged.')+`<section class="card"><div class="inline">${['open','warned','suspended','resolved','dismissed','all'].map(f=>`<button class="btn ${f===reportFilter?'':'secondary'}" data-rf="${f}">${f}</button>`).join('')}</div><div id="repList"><p class="muted">Loading...</p></div></section>`;
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{reportFilter=b.dataset.rf;reportsPage()});
  let d;try{d=await api('/admin-api/reports?status='+reportFilter)}catch(e){repList.innerHTML='<p class="muted">Could not load reports.</p>';return}
  const rows=d.reports||[];
  repList.innerHTML=rows.length?rows.map(r=>`<div class="user" data-rep="${esc(r.id)}"><div><b>${esc(r.target.name)}</b> <span class="muted">reported by ${esc(r.reporter.name)} · room ${esc(r.roomCode||'-')} · ${new Date(r.createdAt).toLocaleString()}</span><div>${esc(r.reason)}</div><div class="muted">Target warnings: ${r.target.penaltyPoints} · Status: ${esc(r.status)}${r.note?' · Note: '+esc(r.note):''}</div></div>${r.status==='open'?`<div class="inline"><input class="input" placeholder="Note (optional)" maxlength="240"><button class="btn secondary" data-act="dismiss">Dismiss</button><button class="btn secondary" data-act="resolve">Resolve</button><button class="btn" data-act="warn">Warn</button><button class="btn danger" data-act="suspend">Suspend 24h</button></div>`:''}</div>`).join(''):'<p class="muted">No reports here.</p>';
  document.querySelectorAll('[data-rep] [data-act]').forEach(b=>b.onclick=async()=>{
    const row=b.closest('[data-rep]'),act=b.dataset.act;
    if((act==='suspend'||act==='warn')&&!confirm('Confirm: '+act+' this player?'))return;
    try{await api('/admin-api/reports/'+row.dataset.rep+'/action',{method:'POST',body:JSON.stringify({action:act,note:row.querySelector('input').value})});adminNotice('Done');reportsPage()}catch(e){adminNotice(e.message||'Failed',true)}
  });
}
function head(title,sub,action=''){return `<div class="top"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function overviewPage(){content.innerHTML=head('Overview','Manage GameHub from separate responsive sections.')+`<div class="grid"><div class="stat"><span class="muted">Configured games</span><b>${games.length}</b></div><div class="stat"><span class="muted">Enabled games</span><b>${games.filter(g=>g.available).length}</b></div><div class="stat"><span class="muted">Users loaded</span><b>${users.length}</b></div><div class="stat"><span class="muted">Admin controls</span><b>Ready</b></div></div><section class="card"><h2>Quick actions</h2><div class="inline"><button class="btn" onclick="location.hash='games';show('games')">Edit games and rules</button><button class="btn secondary" onclick="location.hash='users';show('users')">Find a user</button></div></section>`}
function gameCard(g){const counts=g.playerCounts||[2];return `<article class="card game" data-game="${esc(g.key)}"><div><div class="gamehead"><h2>${esc(g.name)}</h2><label class="switch"><input class="enabled" type="checkbox" ${g.available?'checked':''}> Enabled</label></div><p class="muted">${esc(g.description||'')}</p><b>Allowed room sizes</b><div class="counts">${[2,3,4].map(n=>`<label><input class="count" type="checkbox" value="${n}" ${counts.includes(n)?'checked':''}> ${n} players</label>`).join('')}</div><button class="btn save">Save settings</button> <span class="muted saved"></span></div><div><b>Rules, one per line</b><textarea class="rules">${esc((g.rules||[]).join('\n'))}</textarea></div></article>`}
function gamesPage(){content.innerHTML=head('Games & Rules','Enable games, choose room sizes, and edit rules.')+games.map(gameCard).join('');document.querySelectorAll('.game .save').forEach(b=>b.onclick=async()=>{const c=b.closest('.game'),counts=[...c.querySelectorAll('.count:checked')].map(x=>+x.value);if(!counts.length)return adminNotice('Choose at least one player count.',true);b.disabled=true;try{await api('/admin-api/games/'+c.dataset.game,{method:'PUT',body:JSON.stringify({available:c.querySelector('.enabled').checked,playerCounts:counts,rules:c.querySelector('.rules').value.split('\n').map(x=>x.trim()).filter(Boolean)})});c.querySelector('.saved').textContent='Saved';setTimeout(()=>c.querySelector('.saved').textContent='',1500)}catch(x){adminNotice(x.message,true)}finally{b.disabled=false}})}
function userRow(u){const suspended=u.suspendedUntil&&new Date(u.suspendedUntil)>new Date();return `<div class="user" data-user="${esc(u.id)}"><div><b>${esc(u.displayName||'Player')}</b> ${u.verified?'<span title="Verified" style="color:#1d9bf0">✔</span> ':''}<span class="muted">${esc(u.acUsername?'@'+u.acUsername+' · ':'')}${esc(u.phone||u.email||'')}</span><div class="muted">Coins: ${u.coins||0} · Penalties: ${u.penaltyPoints||0} ${suspended?`<span class="pill">Suspended until ${new Date(u.suspendedUntil).toLocaleString()}</span>`:''}</div><div class="muted">${esc(u.adminNote||'')}</div></div><div class="user-actions"><input class="input coins" type="number" min="0" placeholder="Coins"><input class="input minutes" type="number" min="0" placeholder="Minutes"><input class="input reason" placeholder="Reason"><button class="btn danger penalize">Penalize</button><button class="btn secondary verify" data-on="${u.verified?0:1}">${u.verified?'Remove tick':'Verify ✔'}</button></div></div>`}
async function loadUsers(q=''){const d=await api('/admin-api/users?q='+encodeURIComponent(q));users=d.users||[]}
function usersPage(){content.innerHTML=head('Users & Penalties','Search accounts and apply coin deductions or timed suspensions.')+`<section class="card"><div class="inline"><input class="input" id="search" placeholder="Name, phone, or email"><button class="btn secondary" id="find">Search</button></div><div id="userList">${users.map(userRow).join('')||'<p class="muted">No users found.</p>'}</div></section>`;find.onclick=async()=>{await loadUsers(search.value);userList.innerHTML=users.map(userRow).join('')||'<p class="muted">No users found.</p>';bindPenalties()};bindPenalties()}
function bindPenalties(){document.querySelectorAll('.verify').forEach(b=>b.onclick=async()=>{const r=b.closest('.user');b.disabled=true;try{await api('/admin-api/users/'+r.dataset.user+'/verify',{method:'POST',body:JSON.stringify({verified:b.dataset.on==='1'})});adminNotice(b.dataset.on==='1'?'Verified badge granted':'Verified badge removed');await loadUsers(document.getElementById('search')?.value||'');userList.innerHTML=users.map(userRow).join('');bindPenalties()}catch(x){adminNotice(x.message,true)}finally{b.disabled=false}});document.querySelectorAll('.penalize').forEach(b=>b.onclick=async()=>{const r=b.closest('.user'),body={coins:r.querySelector('.coins').value||0,suspendMinutes:r.querySelector('.minutes').value||0,reason:r.querySelector('.reason').value};b.disabled=true;try{await api('/admin-api/users/'+r.dataset.user+'/penalize',{method:'POST',body:JSON.stringify(body)});adminNotice('Penalty applied');await loadUsers(document.getElementById('search')?.value||'');userList.innerHTML=users.map(userRow).join('');bindPenalties()}catch(x){adminNotice(x.message,true)}finally{b.disabled=false}})}
async function dashboard(){
  let g,u;
  try{[g,u]=await Promise.all([api('/admin-api/games'),api('/admin-api/users')])}
  catch(e){return login(e.status===401?'Signed in, but your browser did not keep the session. Allow cookies for this site and open it over https, then try again.':'Signed in, but the dashboard could not load: '+e.message)}
  games=g.games||[];users=u.users||[];
  try{layout(location.hash.slice(1)||'overview')}catch(e){console.error(e);root.innerHTML='<section class="card login"><h1>Dashboard error</h1><p class="error">'+String(e.message||e).replace(/</g,'&lt;')+'</p><button class="btn" onclick="location.reload()">Reload</button></section>'}}
window.onhashchange=()=>{const p=location.hash.slice(1);if(document.querySelector('[data-page]'))show(p||'overview')};(async()=>{try{const s=await api('/admin-api/session');s.authenticated?dashboard():login()}catch(e){login('Could not reach the server: '+e.message)}})();
</script></body></html>
