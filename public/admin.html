<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub Admin</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#20232a;background:#f4f5f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e1e3ea;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 5px 18px #20232a0d}h1{margin:0 0 6px}h2{margin:0 0 14px;font-size:19px}h3{margin:0;font-size:16px}.muted{color:#697080;font-size:13px}.login{max-width:420px;margin:12vh auto}.input,textarea,select{width:100%;border:1px solid #d8dbe4;border-radius:10px;padding:11px 12px;font:inherit;margin:6px 0 12px;background:#fff}textarea{min-height:125px;resize:vertical}.btn{border:0;border-radius:10px;padding:10px 15px;background:#b5222c;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eef0f5;color:#252936}.btn.danger{background:#8c1821}.btn:disabled{opacity:.5}.error{color:#b5222c;margin:8px 0;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.game{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;align-items:start}.gamehead{display:flex;align-items:center;justify-content:space-between;gap:10px}.switch{display:flex;align-items:center;gap:8px;font-size:13px}.counts{display:flex;gap:10px;flex-wrap:wrap;margin:9px 0 14px}.counts label{padding:8px 11px;border:1px solid #d8dbe4;border-radius:9px}.rule-actions{display:flex;gap:8px;justify-content:flex-end}.user-row{display:grid;grid-template-columns:1.3fr .7fr auto;gap:10px;align-items:center;border-top:1px solid #eceef3;padding:13px 0}.user-meta{font-size:12px;color:#697080}.inline{display:flex;gap:7px;flex-wrap:wrap}.inline input{width:90px;margin:0}.inline input.reason{width:180px}.pill{font-size:11px;background:#fff0d7;color:#875a00;border-radius:999px;padding:4px 8px}@media(max-width:720px){.game{grid-template-columns:1fr}.user-row{grid-template-columns:1fr}.inline input,.inline input.reason{width:100%}}
</style></head><body><main class="wrap"><div id="app"></div></main>
<script>
const app=document.getElementById('app'); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}
async function boot(){try{const s=await api('/admin-api/session');s.authenticated?dashboard():login()}catch{login()}}
function login(){app.innerHTML=`<section class="card login"><h1>GameHub Admin</h1><p class="muted">Restricted administration area</p><form id="login"><label>Admin phone<input class="input" id="phone" autocomplete="username" required></label><label>PIN<input class="input" id="pin" type="password" autocomplete="current-password" required></label><div id="err" class="error"></div><button class="btn" type="submit">Sign in</button></form></section>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();const phoneValue=document.getElementById('phone').value;const pinValue=document.getElementById('pin').value;try{await api('/admin-api/login',{method:'POST',body:JSON.stringify({phone:phoneValue,pin:pinValue})});dashboard()}catch(x){document.getElementById('err').textContent=x.message}}}
async function dashboard(){app.innerHTML='<div class="card">Loading admin panel…</div>';try{const [g,u]=await Promise.all([api('/admin-api/games'),api('/admin-api/users')]);render(g.games,u.users)}catch(x){login();}}
function render(games,users){app.innerHTML=`<div class="top"><div><h1>GameHub Admin</h1><div class="muted">Manage games, rules, player counts, and account penalties.</div></div><button class="btn secondary" id="logout">Log out</button></div><section><h2>Games</h2><div id="games">${games.map(gameCard).join('')}</div></section><section class="card"><h2>User penalties</h2><p class="muted">Search a user, then deduct coins or temporarily suspend the account. Actions are logged on the user record.</p><div class="inline"><input class="input" id="search" placeholder="Name, phone, or email" style="margin:0;flex:1"><button class="btn secondary" id="find">Search</button></div><div id="users">${users.map(userRow).join('')||'<p class="muted">No users found.</p>'}</div></section>`;document.getElementById('logout').onclick=async()=>{await api('/admin-api/logout',{method:'POST'});login()};document.getElementById('find').onclick=async()=>{try{const d=await api('/admin-api/users?q='+encodeURIComponent(document.getElementById('search').value));document.getElementById('users').innerHTML=d.users.map(userRow).join('')||'<p class="muted">No users found.</p>';bindUsers()}catch(x){alert(x.message)}};bindGames();bindUsers()}
function gameCard(g){const counts=g.playerCounts||[2];return `<article class="card game" data-game="${esc(g.key)}"><div><div class="gamehead"><h3>${esc(g.name)}</h3><label class="switch"><input type="checkbox" class="enabled" ${g.available?'checked':''}> Enabled</label></div><p class="muted">${esc(g.description||'')}</p><b>Allowed room sizes</b><div class="counts">${[2,3,4].map(n=>`<label><input type="checkbox" class="count" value="${n}" ${counts.includes(n)?'checked':''}> ${n} players</label>`).join('')}</div><button class="btn save">Save game settings</button><span class="muted saved"></span></div><div><b>Rules (one rule per line)</b><textarea class="rules">${esc((g.rules||[]).join('\n'))}</textarea></div></article>`}
function bindGames(){document.querySelectorAll('.game').forEach(card=>card.querySelector('.save').onclick=async()=>{const counts=[...card.querySelectorAll('.count:checked')].map(x=>+x.value);if(!counts.length)return alert('Choose at least one player count.');const rules=card.querySelector('.rules').value.split('\n').map(x=>x.trim()).filter(Boolean);const b=card.querySelector('.save');b.disabled=true;try{await api('/admin-api/games/'+card.dataset.game,{method:'PUT',body:JSON.stringify({available:card.querySelector('.enabled').checked,playerCounts:counts,rules})});card.querySelector('.saved').textContent=' Saved';setTimeout(()=>card.querySelector('.saved').textContent='',1800)}catch(x){alert(x.message)}finally{b.disabled=false}})}
function userRow(u){const suspended=u.suspendedUntil&&new Date(u.suspendedUntil)>new Date();return `<div class="user-row" data-user="${esc(u.id)}"><div><b>${esc(u.displayName||'Player')}</b> <span class="muted">${esc(u.phone||u.email||'')}</span><div class="user-meta">Coins: ${u.coins||0} · Penalties: ${u.penaltyPoints||0}${suspended?` <span class="pill">Suspended until ${new Date(u.suspendedUntil).toLocaleString()}</span>`:''}</div></div><div class="user-meta">${esc(u.adminNote||'')}</div><div class="inline"><input class="input coins" type="number" min="0" placeholder="coins"><input class="input minutes" type="number" min="0" placeholder="minutes"><input class="input reason" placeholder="reason"><button class="btn danger penalize">Penalize</button></div></div>`}
function bindUsers(){document.querySelectorAll('.penalize').forEach(b=>b.onclick=async()=>{const row=b.closest('.user-row');const coins=row.querySelector('.coins').value||0,minutes=row.querySelector('.minutes').value||0,reason=row.querySelector('.reason').value;b.disabled=true;try{await api('/admin-api/users/'+row.dataset.user+'/penalize',{method:'POST',body:JSON.stringify({coins,suspendMinutes:minutes,reason})});alert('Penalty applied');const d=await api('/admin-api/users?q='+encodeURIComponent(document.getElementById('search')?.value||''));document.getElementById('users').innerHTML=d.users.map(userRow).join('')||'<p class="muted">No users found.</p>';bindUsers()}catch(x){alert(x.message)}finally{b.disabled=false}})}boot();
</script></body></html>
