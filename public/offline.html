<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AllConnect</title><meta name="theme-color" content="#eef1f7">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#eef1f7;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#6b7088}
h1{font:800 38px system-ui,sans-serif;color:#1b2236;margin:0}.l{font-weight:600;font-size:19px;margin:6px 0 22px}.m{font-size:15px;line-height:1.4;margin:0 auto 14px;max-width:360px}
.b{display:flex;gap:12px;justify-content:center}button{border-radius:999px;padding:14px 26px;font:700 16px system-ui,sans-serif;cursor:pointer}.p{background:#1b2236;color:#fff;border:0}.s{background:#fff;color:#1b2236;border:1px solid #d9dde8}
</style></head><body><div>
<h1>AllConnect</h1><p class="l">Loading your game…</p>
<p class="m" id="m">You're offline. Check your connection. Your game is safe: it's saved online.</p>
<div class="b"><button class="p" onclick="retry()">Try again</button><button class="s" onclick="location.reload()">Reload</button></div></div>
<script>
async function retry(){try{const r=await fetch('/health',{cache:'no-store'});if(r.ok){location.replace('/');return}}catch(e){}
document.getElementById('m').textContent="Still offline. Check your connection and try again. Your game is safe: it's saved online."}
window.addEventListener('online',()=>location.replace('/'));
</script></body></html>
